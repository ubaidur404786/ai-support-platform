# CI/CD (v15): test every push; on main, build each service's image and push
# it to Docker Hub.
#
# GitHub Actions is free for public repositories. It needs two repository
# secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your Docker Hub user name
#   DOCKERHUB_TOKEN      an access token from Docker Hub (not your password)

name: ci

on:
  push:
    branches: ["main", "v*"]
  pull_request:
  # A button in the Actions tab to run it by hand.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A throwaway database for the tests. The ready-made pgvector image is
      # fine here: the data lives for a few minutes, so the collation issue
      # behind ADR-026 (an existing volume read by a different C library)
      # cannot happen.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_platform_test
      DB_ECHO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train the ticket classifier
        run: python ml/train.py
      # The 1.1 GB answer model is NOT downloaded here: the tests that need it
      # are skipped, and every other test uses a fake model.
      - run: pytest -q

  images:
    # Only after the tests pass, and only for main: a branch or a pull request
    # should never replace the images that deployments pull.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: support-api
            dockerfile: docker/api/Dockerfile
            context: .
          - image: support-embedding
            dockerfile: docker/embedding-service/Dockerfile
            context: .
          - image: support-model
            dockerfile: docker/model-service/Dockerfile
            context: .
          - image: support-db
            dockerfile: docker/postgres/Dockerfile
            context: docker/postgres
          - image: support-web
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Two tags: "latest" for trying things out, and the commit id, so a
          # deployment can name exactly which code it runs and roll back to it.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          # Reuse layers from the previous build (stored in GitHub's cache).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

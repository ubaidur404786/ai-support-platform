<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1140" height="710" viewBox="0 0 1140 710" font-family="Arial, Helvetica, sans-serif" font-size="13">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker>
 <symbol id="i-user" viewBox="0 0 32 32"><circle cx="16" cy="10" r="6" fill="#444"/><path d="M4,30 C4,19 28,19 28,30 z" fill="#444"/></symbol>
 <symbol id="i-lb" viewBox="0 0 32 32"><circle cx="6" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="5" r="4" fill="#1a56db"/><circle cx="26" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="27" r="4" fill="#1a56db"/><path d="M10,16 L22,5 M10,16 L22,16 M10,16 L22,27" stroke="#1a56db" stroke-width="2.5"/></symbol>
 <symbol id="i-gate" viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="27" rx="2" fill="none" stroke="#6250d6" stroke-width="3"/><rect x="11" y="12" width="10" height="18" fill="#6250d6"/><circle cx="16" cy="8" r="2" fill="#6250d6"/></symbol>
 <symbol id="i-svc" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#1baf7a" stroke-width="5" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="4" fill="#1baf7a"/></symbol>
 <symbol id="i-db" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100"/><path d="M4,6 V26 C4,31 28,31 28,26 V6" fill="#f6c453" stroke="#c98500" stroke-width="1.5"/><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100" stroke="#c98500" stroke-width="1.5"/><path d="M4,16 C4,20 28,20 28,16" fill="none" stroke="#c98500" stroke-width="1.5"/></symbol>
 <symbol id="i-copy" viewBox="0 0 32 32"><path d="M6,16 A10,10 0 1 1 16,26" fill="none" stroke="#1baf7a" stroke-width="3"/><path d="M11,26 L16,26 L16,21" fill="none" stroke="#1baf7a" stroke-width="3"/></symbol>
 <symbol id="i-cpu" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" rx="2" fill="#c81e1e"/><path d="M12,3 V8 M20,3 V8 M12,24 V29 M20,24 V29 M3,12 H8 M3,20 H8 M24,12 H29 M24,20 H29" stroke="#c81e1e" stroke-width="2"/></symbol>
 <symbol id="i-file" viewBox="0 0 32 32"><path d="M7,3 H20 L26,9 V29 H7 z" fill="#fff" stroke="#444" stroke-width="2"/><path d="M11,14 H22 M11,19 H22 M11,24 H18" stroke="#444" stroke-width="2"/></symbol>
 <symbol id="i-net" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#444" stroke-width="2"/><path d="M4,16 H28 M16,4 C9,10 9,22 16,28 M16,4 C23,10 23,22 16,28" fill="none" stroke="#444" stroke-width="2"/></symbol>
</defs><rect width="1140" height="710" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">v18: system design for the AI support platform</text><text x="20" y="56" fill="#52514e">The lab's lessons applied: copy the slow part, keep the API stateless, replicate reads, do not shard yet</text><use href="#i-user" xlink:href="#i-user" x="20" y="72" width="20" height="20"/><text x="46" y="87" font-size="12" fill="#52514e">user</text><use href="#i-lb" xlink:href="#i-lb" x="155" y="72" width="20" height="20"/><text x="181" y="87" font-size="12" fill="#52514e">load balancer</text><use href="#i-gate" xlink:href="#i-gate" x="290" y="72" width="20" height="20"/><text x="316" y="87" font-size="12" fill="#52514e">gateway</text><use href="#i-svc" xlink:href="#i-svc" x="425" y="72" width="20" height="20"/><text x="451" y="87" font-size="12" fill="#52514e">service</text><use href="#i-db" xlink:href="#i-db" x="560" y="72" width="20" height="20"/><text x="586" y="87" font-size="12" fill="#52514e">database</text><use href="#i-copy" xlink:href="#i-copy" x="695" y="72" width="20" height="20"/><text x="721" y="87" font-size="12" fill="#52514e">replica copy</text><use href="#i-cpu" xlink:href="#i-cpu" x="830" y="72" width="20" height="20"/><text x="856" y="87" font-size="12" fill="#52514e">bottleneck (CPU)</text><rect x="20" y="250" width="130" height="80" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-user" xlink:href="#i-user" x="30" y="260" width="30" height="30"/><text x="68" y="280" font-weight="bold" fill="#0b0b0b">Users</text><text x="32" y="306" font-size="12" fill="#52514e">browser</text><rect x="190" y="235" width="170" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-lb" xlink:href="#i-lb" x="200" y="245" width="30" height="30"/><text x="238" y="265" font-weight="bold" fill="#0b0b0b">nginx (web)</text><text x="202" y="291" font-size="12" fill="#52514e">the only public port</text><text x="202" y="308" font-size="12" fill="#52514e">spreads load over</text><text x="202" y="325" font-size="12" fill="#52514e">the API copies</text><rect x="410" y="110" width="190" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="420" y="120" width="30" height="30"/><text x="458" y="140" font-weight="bold" fill="#0b0b0b">Redis</text><text x="422" y="166" font-size="12" fill="#52514e">shared rate limits</text><text x="422" y="183" font-size="12" fill="#52514e">for all API copies</text><rect x="410" y="240" width="190" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="420" y="250" width="30" height="30"/><text x="458" y="270" font-weight="bold" fill="#0b0b0b">API x3</text><text x="422" y="296" font-size="12" fill="#52514e">stateless: any copy</text><text x="422" y="313" font-size="12" fill="#52514e">can serve any user</text><text x="422" y="330" font-size="12" fill="#52514e">scale on req/s</text><rect x="410" y="400" width="190" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="420" y="410" width="30" height="30"/><text x="458" y="430" font-weight="bold" fill="#0b0b0b">worker xN</text><text x="422" y="456" font-size="12" fill="#52514e">reads uploads</text><text x="422" y="473" font-size="12" fill="#52514e">queue = PostgreSQL</text><rect x="660" y="100" width="210" height="100" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="670" y="110" width="30" height="30"/><text x="708" y="130" font-weight="bold" fill="#0b0b0b">embedding-service x2</text><text x="672" y="156" font-size="12" fill="#52514e">question -> vector</text><text x="672" y="173" font-size="12" fill="#52514e">scale with searches</text><rect x="660" y="240" width="210" height="110" rx="8" fill="#fde8e8" stroke="#c81e1e" stroke-width="1.5"/><use href="#i-cpu" xlink:href="#i-cpu" x="670" y="250" width="30" height="30"/><text x="708" y="270" font-weight="bold" fill="#0b0b0b">model-service xN</text><text x="672" y="296" font-size="12" fill="#52514e">THE bottleneck:</text><text x="672" y="313" font-size="12" fill="#52514e">~7 s per answer, 1 CPU</text><text x="672" y="330" font-size="12" fill="#52514e">add copies (1.1 GB each)</text><rect x="920" y="130" width="200" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="930" y="140" width="30" height="30"/><text x="968" y="160" font-weight="bold" fill="#0b0b0b">PostgreSQL primary</text><text x="932" y="186" font-size="12" fill="#52514e">all writes</text><text x="932" y="203" font-size="12" fill="#52514e">documents, pgvector</text><rect x="920" y="290" width="200" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-copy" xlink:href="#i-copy" x="930" y="300" width="30" height="30"/><text x="968" y="320" font-weight="bold" fill="#0b0b0b">read replica</text><text x="932" y="346" font-size="12" fill="#52514e">vector search reads</text><text x="932" y="363" font-size="12" fill="#52514e">standby if primary dies</text><rect x="920" y="420" width="200" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="930" y="430" width="30" height="30"/><text x="968" y="450" font-weight="bold" fill="#0b0b0b">no sharding (yet)</text><text x="932" y="476" font-size="12" fill="#52514e">key: organization_id</text><line x1="150" y1="290" x2="188" y2="290" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="360" y1="290" x2="408" y2="295" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="505" y1="240" x2="505" y2="202" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="600" y1="270" x2="658" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="600" y1="300" x2="658" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="600" y1="330" x2="918" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="600" y1="445" x2="918" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="600" y1="250" x2="918" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="1020" y1="240" x2="1020" y2="288" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="1020.0" y="264.0" text-anchor="middle" font-size="11" fill="#52514e">WAL</text><rect x="20" y="520" width="1100" height="172" rx="8" fill="#f4f4f2" stroke="#888"/><text x="34" y="542" font-weight="bold" fill="#0b0b0b">Why this design (each choice comes from a measurement)</text><text x="34" y="562" fill="#0b0b0b">Scale the bottleneck, not everything: the lab gained only by copying the busy service (step 2a vs 2b); here that is the model service.</text><text x="34" y="580" fill="#0b0b0b">API copies are stateless (JWT, Redis counters), so nginx or a Kubernetes Service can send any request to any copy - pooled, not fixed cells.</text><text x="34" y="598" fill="#0b0b0b">One read replica: answers read many chunks and write few rows, so reads can move off the primary; it is also the failover copy.</text><text x="34" y="616" fill="#0b0b0b">No sharding: one organisation's documents fit easily on one database; writes are tiny. Shard key, when needed: organization_id.</text><text x="34" y="634" fill="#0b0b0b">Bounded queue on the model service: when every copy is busy, say 'busy' at once instead of making users wait minutes.</text><text x="34" y="652" fill="#0b0b0b">On AWS (v19) the same boxes map to: load balancer -> EC2/k3s pods; PostgreSQL could later move to RDS with a replica.</text></svg>
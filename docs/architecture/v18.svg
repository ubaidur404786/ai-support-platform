</defs><rect width="1140" height="590" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">System design of the AI support platform</text><text x="20" y="56" fill="#52514e">Read left to right: users -> entry -> API -> AI services. Data sits underneath.</text><use href="#i-user" xlink:href="#i-user" x="20" y="70" width="20" height="20"/><text x="46" y="85" font-size="12" fill="#52514e">user</text><use href="#i-lb" xlink:href="#i-lb" x="155" y="70" width="20" height="20"/><text x="181" y="85" font-size="12" fill="#52514e">load balancer</text><use href="#i-gate" xlink:href="#i-gate" x="290" y="70" width="20" height="20"/><text x="316" y="85" font-size="12" fill="#52514e">gateway</text><use href="#i-svc" xlink:href="#i-svc" x="425" y="70" width="20" height="20"/><text x="451" y="85" font-size="12" fill="#52514e">service</text><use href="#i-db" xlink:href="#i-db" x="560" y="70" width="20" height="20"/><text x="586" y="85" font-size="12" fill="#52514e">database</text><use href="#i-copy" xlink:href="#i-copy" x="695" y="70" width="20" height="20"/><text x="721" y="85" font-size="12" fill="#52514e">replica copy</text><use href="#i-cpu" xlink:href="#i-cpu" x="830" y="70" width="20" height="20"/><text x="856" y="85" font-size="12" fill="#52514e">bottleneck (CPU)</text><text x="20" y="112" font-size="12" font-weight="bold" fill="#898781">1. USERS</text><text x="190" y="112" font-size="12" font-weight="bold" fill="#898781">2. ENTRY</text><text x="420" y="112" font-size="12" font-weight="bold" fill="#898781">3. STATELESS API</text><text x="720" y="112" font-size="12" font-weight="bold" fill="#898781">4. AI SERVICES</text><text x="960" y="112" font-size="12" font-weight="bold" fill="#898781">5. ALWAYS ON</text><line x1="20" y1="122" x2="1120" y2="122" stroke="#e1e0d9"/><rect x="20" y="230" width="140" height="80" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-user" xlink:href="#i-user" x="30" y="240" width="30" height="30"/><text x="68" y="260" font-weight="bold" fill="#0b0b0b">Users</text><text x="32" y="286" font-size="12" fill="#52514e">browser</text><rect x="190" y="220" width="190" height="100" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-lb" xlink:href="#i-lb" x="200" y="230" width="30" height="30"/><text x="238" y="250" font-weight="bold" fill="#0b0b0b">nginx (web)</text><text x="202" y="276" font-size="12" fill="#52514e">only public port</text><text x="202" y="293" font-size="12" fill="#52514e">spreads requests</text><rect x="420" y="220" width="220" height="100" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="430" y="230" width="30" height="30"/><text x="468" y="250" font-weight="bold" fill="#0b0b0b">API x3</text><text x="432" y="276" font-size="12" fill="#52514e">stateless: any copy</text><text x="432" y="293" font-size="12" fill="#52514e">serves any user</text><rect x="420" y="135" width="220" height="60" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="430" y="145" width="30" height="30"/><text x="468" y="165" font-weight="bold" fill="#0b0b0b">Redis: shared limits</text><rect x="720" y="140" width="210" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="730" y="150" width="30" height="30"/><text x="768" y="170" font-weight="bold" fill="#0b0b0b">embedding x2</text><text x="732" y="196" font-size="12" fill="#52514e">question -> vector</text><rect x="720" y="260" width="210" height="100" rx="8" fill="#fde8e8" stroke="#c81e1e" stroke-width="1.5"/><use href="#i-cpu" xlink:href="#i-cpu" x="730" y="270" width="30" height="30"/><text x="768" y="290" font-weight="bold" fill="#0b0b0b">model-service xN</text><text x="732" y="316" font-size="12" fill="#52514e">slowest part: ~7 s/answer</text><text x="732" y="333" font-size="12" fill="#52514e">copy this first</text><rect x="960" y="140" width="160" height="220" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-file" xlink:href="#i-file" x="970" y="150" width="30" height="30"/><text x="1008" y="170" font-weight="bold" fill="#0b0b0b">Health checks</text><text x="972" y="196" font-size="12" fill="#52514e">restart dead copies</text><text x="972" y="213" font-size="12" fill="#52514e">busy -> 503 at once</text><text x="972" y="230" font-size="12" fill="#52514e">(bounded queue)</text><line x1="20" y1="392" x2="1120" y2="392" stroke="#e1e0d9"/><text x="20" y="412" font-size="12" font-weight="bold" fill="#898781">DATA</text><rect x="190" y="425" width="190" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="200" y="435" width="30" height="30"/><text x="238" y="455" font-weight="bold" fill="#0b0b0b">worker xN</text><text x="202" y="481" font-size="12" fill="#52514e">reads uploads</text><rect x="420" y="425" width="220" height="90" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="430" y="435" width="30" height="30"/><text x="468" y="455" font-weight="bold" fill="#0b0b0b">PostgreSQL primary</text><text x="432" y="481" font-size="12" fill="#52514e">all writes + pgvector</text><rect x="720" y="425" width="210" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-copy" xlink:href="#i-copy" x="730" y="435" width="30" height="30"/><text x="768" y="455" font-weight="bold" fill="#0b0b0b">read replica</text><text x="732" y="481" font-size="12" fill="#52514e">search reads, standby</text><rect x="960" y="425" width="160" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="970" y="435" width="30" height="30"/><text x="1008" y="455" font-weight="bold" fill="#0b0b0b">no sharding yet</text><text x="972" y="481" font-size="12" fill="#52514e">key: organization_id</text><line x1="160" y1="270" x2="188" y2="270" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="380" y1="270" x2="418" y2="270" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="530" y1="220" x2="530" y2="197" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="640" y1="250" x2="718" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="640" y1="290" x2="718" y2="305" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="530" y1="320" x2="530" y2="423" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="380" y1="470" x2="418" y2="470" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="640" y1="470" x2="718" y2="470" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="679.0" y="464.0" text-anchor="middle" font-size="11" fill="#52514e">WAL copy</text><rect x="20" y="540" width="1100" height="34" rx="8" fill="#e8f0fe" stroke="#1a56db"/><text x="34" y="562" font-weight="bold" fill="#1a56db">Copy the slow part  |  stateless API in one pool  |  one read replica  |  no sharding until writes need it</text></svg>
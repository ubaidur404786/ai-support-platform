<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">v15 — CI/CD: test every push, publish images from main</text>
  <text x="30" y="56" fill="#c62828">PROBLEM: images built by hand on one laptop; nothing tied an image to passing tests; no registry for a server to pull from.</text>
  <text x="30" y="74" fill="#1565c0">FIX: .github/workflows/ci.yml — job "test" on every push; job "images" only on main after "test" passes → Docker Hub.</text>

  <rect x="20" y="100" width="150" height="70" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="32" y="122" font-weight="bold" fill="#222" font-size="12">git push</text>
  <text x="32" y="140" fill="#333" font-size="11">main, v* branch,</text>
  <text x="32" y="156" fill="#333" font-size="11">or pull request</text>
  <line x1="170" y1="135" x2="208" y2="135" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <rect x="210" y="96" width="320" height="150" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="222" y="116" font-weight="bold" fill="#222" font-size="12">job: test (ubuntu-latest)</text>
  <text x="222" y="136" fill="#333" font-size="11">service: pgvector/pgvector:pg17 (throwaway DB)</text>
  <text x="222" y="154" fill="#333" font-size="11">pip install -r requirements.txt</text>
  <text x="222" y="172" fill="#333" font-size="11">python ml/train.py</text>
  <text x="222" y="190" fill="#333" font-size="11">pytest -q</text>
  <text x="222" y="210" fill="#666" font-size="10">real 1.1 GB answer model not downloaded:</text>
  <text x="222" y="224" fill="#666" font-size="10">its 2 tests are skipped; everything else runs</text>
  <line x1="530" y1="170" x2="568" y2="170" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="532" y="160" fill="#1565c0" font-size="10">passed + main</text>

  <rect x="570" y="96" width="250" height="150" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="582" y="116" font-weight="bold" fill="#222" font-size="12">job: images (matrix, in parallel)</text>
  <text x="582" y="136" fill="#333" font-size="11">support-api</text>
  <text x="582" y="152" fill="#333" font-size="11">support-embedding</text>
  <text x="582" y="168" fill="#333" font-size="11">support-model</text>
  <text x="582" y="184" fill="#333" font-size="11">support-db</text>
  <text x="582" y="206" fill="#333" font-size="11">docker/build-push-action</text>
  <text x="582" y="222" fill="#666" font-size="10">layers cached between runs (type=gha)</text>
  <line x1="820" y1="170" x2="858" y2="170" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <rect x="860" y="110" width="160" height="120" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="872" y="130" font-weight="bold" fill="#222" font-size="12">Docker Hub</text>
  <text x="872" y="150" fill="#333" font-size="11">&lt;user&gt;/support-api</text>
  <text x="872" y="168" fill="#333" font-size="11">  :latest</text>
  <text x="872" y="186" fill="#333" font-size="11">  :&lt;commit id&gt;</text>
  <text x="872" y="210" fill="#666" font-size="10">pulled by k3s on AWS (v18)</text>

  <text x="30" y="282" font-size="12" font-weight="bold" fill="#222" letter-spacing="1">MEASURED — first runs on GitHub, 2026-10-27</text>

  <rect x="20" y="294" width="490" height="110" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="32" y="314" font-weight="bold" fill="#222" font-size="12">test job</text>
  <text x="32" y="336" fill="#1565c0" font-size="11">passed on the branch and on main: 2 min 35 s</text>
  <text x="32" y="356" fill="#333" font-size="11">(laptop: 5.5 min with the real-model tests)</text>
  <text x="32" y="376" fill="#333" font-size="11">branch run: images job skipped, as intended</text>

  <rect x="530" y="294" width="490" height="110" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="542" y="314" font-weight="bold" fill="#222" font-size="12">images job</text>
  <text x="542" y="336" fill="#c62828" font-size="11">all 4 failed: 401 "access token has insufficient scopes"</text>
  <text x="542" y="356" fill="#333" font-size="11">the token was read-only: login OK, push refused</text>
  <text x="542" y="376" fill="#333" font-size="11">fix: a Read &amp; Write token in DOCKERHUB_TOKEN, re-run</text>

  <rect x="20" y="424" width="1000" height="112" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="34" y="446" font-weight="bold" fill="#c62828" font-size="13">NEXT LIMITATION → v16-kubernetes</text>
  <text x="34" y="468" fill="#333" font-size="12">• The images can be pulled anywhere, but they still run as one container per service on one machine: one API = a single point of failure.</text>
  <text x="34" y="488" fill="#333" font-size="12">• Nothing sends traffic only to copies that are ready, and an update means downtime.</text>
  <text x="34" y="508" fill="#333" font-size="12">• CI never runs the real answer model.</text>
</svg>

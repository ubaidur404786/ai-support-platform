<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1040" height="880" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">v4 — Authentication and tenant isolation</text>
  <text x="30" y="56" fill="#555">PROBLEM: every request was anonymous and every ticket was readable by anyone who reached the port.</text>
  <text x="30" y="74" fill="#555">FIX: a token identifies the caller, and organization_id is a required argument on every read — forgetting it is a TypeError, not a leak.</text>

  <!-- Client -->
  <rect x="30" y="96" width="560" height="66" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="118" font-weight="bold" fill="#222" font-size="12">Client</text>
  <text x="42" y="136" font-family="Consolas, monospace" fill="#333" font-size="11">POST /tickets   {"text": "I was charged twice"}</text>
  <text x="42" y="153" font-family="Consolas, monospace" fill="#333" font-size="11">Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…</text>

  <rect x="610" y="96" width="400" height="66" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="622" y="118" font-weight="bold" fill="#222" font-size="12">No header at all → 401, never 403</text>
  <text x="622" y="136" fill="#333" font-size="11">401 means "I do not know who you are".</text>
  <text x="622" y="153" fill="#333" font-size="11">403 means "I know, and the answer is no". Different questions.</text>

  <line x1="310" y1="162" x2="310" y2="184" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="30" y="186" width="560" height="62" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="208" font-weight="bold" fill="#222" font-size="12">tickets/router.py — THE GATE</text>
  <text x="42" y="226" font-family="Consolas, monospace" fill="#333" font-size="11">current_user: User = Depends(get_current_user)</text>
  <text x="42" y="242" fill="#666" font-size="10">A dependency runs BEFORE the handler body, so an anonymous caller never reaches the code below.</text>

  <rect x="610" y="186" width="400" height="62" rx="6" fill="#fafbfc" stroke="#999" stroke-dasharray="5,3"/>
  <text x="622" y="208" font-weight="bold" fill="#222" font-size="12">Structural, not a check</text>
  <text x="622" y="226" fill="#333" font-size="11">A handler cannot forget to call this — it is in the</text>
  <text x="622" y="242" fill="#333" font-size="11">signature. A new endpoint that omits it is public, though.</text>

  <line x1="310" y1="248" x2="310" y2="270" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- get_current_user -->
  <rect x="30" y="272" width="560" height="96" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="294" font-weight="bold" fill="#222" font-size="12">auth/dependencies.py — WHO IS THIS?</text>
  <text x="42" y="313" font-size="11" fill="#333">1. read_access_token()  — verify signature + expiry, return "sub"</text>
  <text x="42" y="330" font-size="11" fill="#333">2. repository.get_user(id)  — one primary-key lookup</text>
  <text x="42" y="347" font-size="11" fill="#333">3. is_active check  — any failure is one 401, never a reason</text>
  <text x="42" y="362" fill="#666" font-size="10">Storage down here is 503, not 401: we could not determine who they are, which is our problem.</text>

  <rect x="610" y="272" width="400" height="96" rx="6" fill="#fafbfc" stroke="#999" stroke-dasharray="5,3"/>
  <text x="622" y="294" font-weight="bold" fill="#222" font-size="12">Why load the user on every request</text>
  <text x="622" y="313" fill="#333" font-size="11">The token could carry organization_id and save a query.</text>
  <text x="622" y="330" fill="#333" font-size="11">But a signed token cannot be un-signed: a user disabled</text>
  <text x="622" y="347" fill="#333" font-size="11">one minute ago would stay valid for up to an hour.</text>
  <text x="622" y="362" fill="#1565c0" font-size="10">Measured cost of choosing correctness: 0.183 ms per request.</text>

  <path d="M 310 368 L 310 392" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="320" y="386" fill="#666" font-size="11">User(id=2, organization_id=3)</text>

  <!-- Service -->
  <rect x="30" y="394" width="560" height="72" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="416" font-weight="bold" fill="#222" font-size="12">tickets/service.py — THE POLICY</text>
  <text x="42" y="435" font-family="Consolas, monospace" fill="#333" font-size="11">submit(organization_id, text)  →  Ticket(organization_id=…)</text>
  <text x="42" y="452" fill="#c62828" font-size="10">The organisation comes from the verified token, NEVER from the request body. CreateTicketRequest has no such field.</text>

  <rect x="610" y="394" width="400" height="72" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="622" y="416" font-weight="bold" fill="#222" font-size="12">Required, not optional</text>
  <text x="622" y="435" font-family="Consolas, monospace" fill="#333" font-size="10">def list(self, organization_id: int, …)</text>
  <text x="622" y="452" fill="#333" font-size="11">An optional filter you forget returns every tenant's rows</text>
  <text x="622" y="462" fill="#333" font-size="11">and passes every test. A missing argument crashes.</text>

  <line x1="310" y1="466" x2="310" y2="488" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Repository -->
  <rect x="30" y="490" width="560" height="84" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="42" y="512" font-weight="bold" fill="#222" font-size="12">tickets/repository.py — THE ENFORCEMENT</text>
  <text x="42" y="531" font-family="Consolas, monospace" fill="#333" font-size="10">SELECT … WHERE organization_id = 3 ORDER BY id LIMIT 50</text>
  <text x="42" y="547" font-family="Consolas, monospace" fill="#333" font-size="10">SELECT … WHERE id = 47 AND organization_id = 3</text>
  <text x="42" y="566" fill="#666" font-size="10">_filtered() applies the organisation condition with no "if" in front of it. session.get() had to go: primary key only.</text>

  <rect x="610" y="490" width="400" height="84" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="622" y="512" font-weight="bold" fill="#222" font-size="12">Another tenant's ticket → 404, not 403</text>
  <text x="622" y="531" fill="#333" font-size="11">403 confirms the row exists. Walk the ids and you have</text>
  <text x="622" y="547" fill="#333" font-size="11">mapped a competitor's ticket volume.</text>
  <text x="622" y="566" fill="#333" font-size="11">404 is the honest answer: no such ticket, for you.</text>

  <line x1="310" y1="574" x2="310" y2="596" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="598" width="560" height="42" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="624" text-anchor="middle" font-weight="bold" fill="#222" font-size="12">PostgreSQL — organizations, users, tickets.organization_id NOT NULL</text>

  <!-- Measurements -->
  <text x="30" y="678" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MEASURED LOCALLY — 13,000 TICKETS, DB_ECHO=false, NO --reload, SAME SESSION</text>

  <rect x="30" y="692" width="320" height="94" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="42" y="712" font-size="12" fill="#222"><tspan font-weight="bold">Login is bcrypt, and nothing else</tspan></text>
  <text x="42" y="732" font-size="12" fill="#222">bcrypt verify alone      682.2 ms</text>
  <text x="42" y="750" font-size="12" fill="#222">POST /auth/login P50     682 ms</text>
  <text x="42" y="766" font-size="11" fill="#666">n=10, min 655, max 770. Cost factor 12.</text>
  <text x="42" y="780" font-size="11" fill="#666">Same number: the query and signing vanish.</text>

  <rect x="360" y="692" width="320" height="94" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="372" y="712" font-size="12" fill="#222"><tspan font-weight="bold">Knowing who you are is nearly free</tspan></text>
  <text x="372" y="732" font-size="12" fill="#222">GET /tickets P50        33.8 ms</text>
  <text x="372" y="750" font-size="12" fill="#222">users lookup             0.183 ms</text>
  <text x="372" y="766" font-size="12" fill="#222">tickets page             0.246 ms</text>
  <text x="372" y="780" font-size="11" fill="#666">n=20. Database = 1.3% of the request.</text>

  <rect x="690" y="692" width="320" height="94" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="702" y="712" font-size="12" fill="#222"><tspan font-weight="bold">The tenant filter costs nothing</tspan></text>
  <text x="702" y="732" font-size="12" fill="#222">page, no filter (warm)   0.145 ms</text>
  <text x="702" y="750" font-size="12" fill="#222">page, org filter (warm)  0.128 ms</text>
  <text x="702" y="766" font-size="11" fill="#666">Difference is jitter. Planner DECLINED the new</text>
  <text x="702" y="780" font-size="11" fill="#666">index here: 100% of rows match, so it helps nothing.</text>

  <rect x="30" y="796" width="980" height="34" rx="4" fill="#eef4fd" stroke="#1565c0"/>
  <text x="42" y="817" font-size="12" fill="#222"><tspan font-weight="bold">Unplanned side effect:</tspan> count(*) now uses <tspan font-family="Consolas, monospace">Index Only Scan on ix_tickets_organization_id</tspan>, Heap Fetches: 0 — 5.78 ms. An index added for security gave the counter a covering index. Not a validated speedup (v3's 22.3 ms was another session), but a structurally better plan.</text>

  <rect x="30" y="838" width="980" height="30" rx="4" fill="#fdf0ef" stroke="#c62828"/>
  <text x="42" y="857" font-size="12" fill="#222"><tspan font-weight="bold">Next limitations:</tspan> 1. POST /classify is still public and burns 1.68 ms of CPU per call — needs auth + per-caller rate limiting.  2. /auth/login costs 682 ms unauthenticated: a DoS surface created by this version.  3. No token revocation before expiry.  4. Test suite 7 s → 103 s.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1040" height="1000" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">v7 — Background processing for document ingestion</text>
  <text x="30" y="56" fill="#c62828">PROBLEM: extraction ran inside the upload request — 8 s for a 300-page PDF — and, because of Python's GIL, slowed every other user's request.</text>
  <text x="30" y="74" fill="#1565c0">FIX: the upload only stores the file and answers 202 "queued"; a separate worker process (python -m app.worker) does the slow part.</text>

  <!-- API process -->
  <rect x="20" y="92" width="480" height="520" rx="8" fill="none" stroke="#999" stroke-dasharray="5,4"/>
  <text x="34" y="112" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">API PROCESS (uvicorn) — milliseconds</text>

  <rect x="40" y="124" width="440" height="44" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="52" y="144" font-family="Consolas, monospace" fill="#333" font-size="11">POST /documents  file=manual.pdf  Bearer eyJ…</text>
  <text x="52" y="160" fill="#666" font-size="10">.txt / .md / .pdf, ≤ 5 MB</text>
  <line x1="260" y1="168" x2="260" y2="186" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="188" width="440" height="44" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="52" y="207" font-weight="bold" fill="#222" font-size="12">request_limits.py → auth → limit_ingestion (unchanged)</text>
  <text x="52" y="224" fill="#666" font-size="10">413 too big · 401 no token · 429 over 20 uploads/min</text>
  <line x1="260" y1="232" x2="260" y2="250" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="252" width="440" height="78" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="52" y="271" font-weight="bold" fill="#222" font-size="12">documents/service.py — upload(): only cheap checks</text>
  <text x="52" y="288" fill="#333" font-size="11">name + first bytes → 415 · SHA-256 already stored → 409</text>
  <text x="52" y="304" fill="#1565c0" font-size="11">≥ 50 documents waiting in this organisation → 429 (backpressure)</text>
  <text x="52" y="320" fill="#666" font-size="10">No extraction, no chunking here any more.</text>
  <line x1="260" y1="330" x2="260" y2="348" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="350" width="440" height="60" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="52" y="369" font-weight="bold" fill="#222" font-size="12">documents/repository.py — add(document, bytes)</text>
  <text x="52" y="386" fill="#333" font-size="11">ONE transaction: documents row (status "queued")</text>
  <text x="52" y="401" fill="#333" font-size="11">+ document_files row (the uploaded bytes)</text>
  <line x1="260" y1="410" x2="260" y2="428" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="430" width="440" height="44" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="52" y="449" font-family="Consolas, monospace" fill="#333" font-size="11">202 {"id": 21, "status": "queued", "chunk_count": 0}</text>
  <text x="52" y="465" fill="#666" font-size="10">"stored, will be processed" — not "ready"</text>

  <rect x="40" y="494" width="440" height="100" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="52" y="513" font-weight="bold" fill="#222" font-size="12">Client polls GET /documents/21</text>
  <text x="52" y="531" font-family="Consolas, monospace" fill="#333" font-size="11">queued → processing → ready</text>
  <text x="52" y="548" font-family="Consolas, monospace" fill="#333" font-size="11">                     └→ failed + error_message</text>
  <text x="52" y="566" fill="#666" font-size="10">Only "ready" documents have chunks, so only they appear in</text>
  <text x="52" y="580" fill="#666" font-size="10">GET /documents/search. Listing no longer reads content (deferred).</text>

  <!-- PostgreSQL -->
  <rect x="530" y="92" width="490" height="180" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="546" y="114" font-weight="bold" fill="#222" font-size="13">PostgreSQL — also the queue (ADR-021)</text>
  <text x="546" y="136" fill="#333" font-size="11">documents: + status (indexed), attempts, error_message,</text>
  <text x="546" y="152" fill="#333" font-size="11">              processing_started_at, processed_at</text>
  <text x="546" y="172" fill="#1565c0" font-size="11">document_files: the bytes, only until processed (ADR-022)</text>
  <text x="546" y="192" fill="#333" font-size="11">document_chunks: unchanged (tsvector + GIN)</text>
  <text x="546" y="216" fill="#666" font-size="10">No Redis, no broker: the document and its job are the same row,</text>
  <text x="546" y="230" fill="#666" font-size="10">committed together — no "row saved but job lost" crash window.</text>
  <text x="546" y="254" fill="#666" font-size="10">Migration 4b9d2e6f8a13 — existing documents become "ready".</text>
  <line x1="480" y1="380" x2="528" y2="200" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

  <!-- Worker process -->
  <rect x="530" y="292" width="490" height="320" rx="8" fill="none" stroke="#1565c0" stroke-dasharray="5,4"/>
  <text x="546" y="312" font-size="12" font-weight="bold" fill="#1565c0" letter-spacing="1">WORKER PROCESS — python -m app.worker (new)</text>
  <line x1="775" y1="272" x2="775" y2="322" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

  <rect x="550" y="324" width="450" height="44" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="562" y="343" font-weight="bold" fill="#222" font-size="12">processing.py — requeue_stale_documents()</text>
  <text x="562" y="360" fill="#666" font-size="10">"processing" for &gt; 5 min → its worker died → back to "queued" (or "failed" after 3 tries)</text>

  <rect x="550" y="376" width="450" height="58" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="562" y="395" font-weight="bold" fill="#222" font-size="12">claim_next_document()</text>
  <text x="562" y="411" font-family="Consolas, monospace" fill="#333" font-size="10">WHERE status='queued' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED</text>
  <text x="562" y="426" fill="#666" font-size="10">→ "processing", attempts+1. Two workers never get the same document.</text>

  <rect x="550" y="442" width="450" height="44" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="562" y="461" font-weight="bold" fill="#222" font-size="12">process_document(): extract_text → chunk_text</text>
  <text x="562" y="478" fill="#666" font-size="10">The slow part (seconds). No transaction held open while it runs.</text>

  <rect x="550" y="494" width="450" height="58" rx="6" fill="#e8f0fe" stroke="#1565c0" stroke-width="1.5"/>
  <text x="562" y="513" font-weight="bold" fill="#222" font-size="12">ONE transaction: chunks + content + "ready" + delete file</text>
  <text x="562" y="530" fill="#333" font-size="10">Broken / empty / too many pages → "failed" + reason (no retry)</text>
  <text x="562" y="545" fill="#333" font-size="10">Unexpected error → rollback, "queued" again (3 attempts max)</text>

  <rect x="550" y="560" width="450" height="40" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="562" y="577" font-weight="bold" fill="#222" font-size="11">Found by measuring: the worker could not save at all</text>
  <text x="562" y="592" fill="#333" font-size="10">It never imported the users/organizations models. Fixed + fresh-interpreter test.</text>

  <!-- Measurements -->
  <text x="30" y="644" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MEASURED (laptop on battery, 1 API process + 1 worker, DB_ECHO=false, two rounds per version, P50)</text>
  <rect x="30" y="654" width="320" height="110" rx="6" fill="#f4f6f8" stroke="#bbb"/>
  <text x="42" y="674" font-weight="bold" fill="#222" font-size="12">Upload answers (uploader's wait)</text>
  <text x="42" y="694" fill="#333" font-size="11">300-page PDF: 7,848–8,144 → 154–217 ms</text>
  <text x="42" y="712" fill="#333" font-size="11">4.9 MB text: 10,324–11,343 → 775–854 ms</text>
  <text x="42" y="732" fill="#666" font-size="10">Ready-to-search time unchanged (8.5–9.5 s PDF):</text>
  <text x="42" y="746" fill="#666" font-size="10">same work, done after the answer.</text>

  <rect x="360" y="654" width="340" height="110" rx="6" fill="#f4f6f8" stroke="#bbb"/>
  <text x="372" y="674" font-weight="bold" fill="#222" font-size="12">Everyone else: GET /health during</text>
  <text x="372" y="690" font-weight="bold" fill="#222" font-size="12">4 × 300-page PDFs</text>
  <text x="372" y="710" fill="#333" font-size="11">P50: 335–729 ms → 17–21 ms (quiet: ~15 ms)</text>
  <text x="372" y="728" fill="#333" font-size="11">P95: 2,220–2,979 ms → 34–134 ms</text>
  <text x="372" y="748" fill="#666" font-size="10">All 4 ready: 33–36 s → 32–53 s (one worker, in series)</text>

  <rect x="710" y="654" width="310" height="110" rx="6" fill="#f4f6f8" stroke="#bbb"/>
  <text x="722" y="674" font-weight="bold" fill="#222" font-size="12">Unplanned: list read unused text</text>
  <text x="722" y="694" fill="#333" font-size="11">List query, 5 rows, org with 3 × 4.9 MB docs</text>
  <text x="722" y="712" fill="#333" font-size="11">(in-process, P50 of 20):</text>
  <text x="722" y="730" fill="#333" font-size="11">content loaded 153.5 ms → deferred 3.4 ms</text>
  <text x="722" y="750" fill="#666" font-size="10">Crash recovery seen for real: 1 requeued.</text>

  <!-- trade-offs -->
  <rect x="30" y="782" width="990" height="80" rx="6" fill="#ffffff" stroke="#bbb"/>
  <text x="42" y="802" font-weight="bold" fill="#222" font-size="12">New complexity</text>
  <text x="42" y="822" fill="#333" font-size="11">Two processes to run — a stopped worker is silent (uploads stay "queued"). Clients must poll. Broken PDFs report "failed" later instead of 422 now.</text>
  <text x="42" y="840" fill="#333" font-size="11">Polling adds up to 1 s; a crashed worker's document waits 5 min. One worker processes in series — throughput needs more workers.</text>

  <!-- next limitation -->
  <rect x="30" y="880" width="990" height="96" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="44" y="902" font-weight="bold" fill="#222" font-size="13">Next limitation</text>
  <text x="44" y="924" fill="#333" font-size="12">Keyword search still misses meaning: paraphrase hit@3 0.47, 20% return nothing (v6 evaluation, 30 questions).</text>
  <text x="44" y="944" fill="#333" font-size="12">Ingestion now runs off the request path, so embedding every chunk at ingest no longer costs users anything → v8-embeddings.</text>
  <text x="44" y="964" fill="#666" font-size="11">Also open: no alert when the worker stops or the queue grows; rate-limit buckets still per process.</text>
</svg>

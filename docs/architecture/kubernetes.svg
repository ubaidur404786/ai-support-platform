<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
  </defs>
  <rect width="1100" height="900" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#222">How the parts talk to each other on Kubernetes</text>
  <text x="30" y="58" fill="#666">Each row is one part of the system: the Service that gives it a fixed name, the pods that do the work, and who calls it.</text>

  <!-- legend -->
  <rect x="30" y="72" width="16" height="12" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="52" y="83" font-size="11" fill="#444">Service (a fixed name + port; sends traffic to a healthy pod)</text>
  <rect x="400" y="72" width="16" height="12" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="422" y="83" font-size="11" fill="#444">Pod (runs one container)</text>
  <rect x="580" y="72" width="16" height="12" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="602" y="83" font-size="11" fill="#444">Deployment / StatefulSet (keeps N pods running)</text>
  <line x1="900" y1="78" x2="930" y2="78" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <text x="936" y="83" font-size="11" fill="#444">from outside</text>

  <!-- outside -->
  <text x="40" y="118" font-size="11" font-weight="bold" fill="#888" letter-spacing="1">OUTSIDE</text>
  <rect x="30" y="150" width="120" height="54" rx="6" fill="#f4f6f8" stroke="#555"/>
  <text x="90" y="174" text-anchor="middle" font-weight="bold" fill="#222">Browser</text>
  <text x="90" y="192" text-anchor="middle" font-size="11" fill="#666">:30080</text>
  <line x1="150" y1="177" x2="196" y2="177" stroke="#e65100" stroke-width="2.2" marker-end="url(#o)"/>

  <!-- cluster -->
  <rect x="170" y="100" width="910" height="560" rx="10" fill="none" stroke="#999" stroke-dasharray="6,4"/>
  <text x="186" y="118" font-size="11" font-weight="bold" fill="#888" letter-spacing="1">KUBERNETES CLUSTER (k3s)</text>
  <text x="200" y="138" font-size="11" font-weight="bold" fill="#555">SERVICE (name : port)</text>
  <text x="450" y="138" font-size="11" font-weight="bold" fill="#555">WORKLOAD → PODS</text>
  <text x="850" y="138" font-size="11" font-weight="bold" fill="#555">CALLED BY</text>

  <!-- row 1 web -->
  <rect x="200" y="152" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
  <text x="310" y="173" text-anchor="middle" font-weight="bold" fill="#222">web : 8080</text>
  <text x="310" y="191" text-anchor="middle" font-size="11" fill="#e65100">NodePort 30080 — PUBLIC</text>
  <rect x="440" y="148" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="162" font-size="10" fill="#1565c0">Deployment web ×1</text>
  <rect x="450" y="168" width="150" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="525" y="189" text-anchor="middle" font-size="12" fill="#222">pod: nginx + React</text>
  <text x="850" y="173" font-size="12" fill="#222">the browser</text>
  <text x="850" y="191" font-size="11" fill="#888">/api/… is passed to "api"</text>

  <!-- row 2 api -->
  <rect x="200" y="222" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100"/>
  <text x="310" y="243" text-anchor="middle" font-weight="bold" fill="#222">api : 8000</text>
  <text x="310" y="261" text-anchor="middle" font-size="11" fill="#666">ClusterIP — internal</text>
  <rect x="440" y="218" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="232" font-size="10" fill="#1565c0">Deployment api ×3  (kubectl scale … --replicas=5)</text>
  <rect x="450" y="238" width="118" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="509" y="259" text-anchor="middle" font-size="12" fill="#222">pod: api</text>
  <rect x="576" y="238" width="118" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="635" y="259" text-anchor="middle" font-size="12" fill="#222">pod: api</text>
  <rect x="702" y="238" width="118" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="761" y="259" text-anchor="middle" font-size="12" fill="#222">pod: api</text>
  <text x="850" y="243" font-size="12" fill="#222">web pod</text>
  <text x="850" y="261" font-size="11" fill="#888">Service picks one ready pod</text>

  <!-- row 3 embedding -->
  <rect x="200" y="292" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100"/>
  <text x="310" y="313" text-anchor="middle" font-weight="bold" fill="#222">embedding-service : 8002</text>
  <text x="310" y="331" text-anchor="middle" font-size="11" fill="#666">ClusterIP — internal</text>
  <rect x="440" y="288" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="302" font-size="10" fill="#1565c0">Deployment embedding-service ×1</text>
  <rect x="450" y="308" width="200" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="550" y="329" text-anchor="middle" font-size="12" fill="#222">pod: search model (MiniLM)</text>
  <text x="850" y="313" font-size="12" fill="#222">api pods, worker pod</text>
  <text x="850" y="331" font-size="11" fill="#888">text → 384 numbers</text>

  <!-- row 4 model -->
  <rect x="200" y="362" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100"/>
  <text x="310" y="383" text-anchor="middle" font-weight="bold" fill="#222">model-service : 8001</text>
  <text x="310" y="401" text-anchor="middle" font-size="11" fill="#666">ClusterIP — internal</text>
  <rect x="440" y="358" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="372" font-size="10" fill="#1565c0">Deployment model-service ×1 (each copy = another 1.1 GB model)</text>
  <rect x="450" y="378" width="230" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="565" y="399" text-anchor="middle" font-size="12" fill="#222">pod: answer model (Qwen2.5-1.5B)</text>
  <text x="850" y="383" font-size="12" fill="#222">api pods</text>
  <text x="850" y="401" font-size="11" fill="#888">question + chunks → answer</text>

  <!-- row 5 redis -->
  <rect x="200" y="432" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100"/>
  <text x="310" y="453" text-anchor="middle" font-weight="bold" fill="#222">redis : 6379</text>
  <text x="310" y="471" text-anchor="middle" font-size="11" fill="#666">ClusterIP — internal</text>
  <rect x="440" y="428" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="442" font-size="10" fill="#1565c0">Deployment redis ×1</text>
  <rect x="450" y="448" width="150" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="525" y="469" text-anchor="middle" font-size="12" fill="#222">pod: redis</text>
  <text x="850" y="453" font-size="12" fill="#222">api pods</text>
  <text x="850" y="471" font-size="11" fill="#888">shared rate-limit counters</text>

  <!-- row 6 db -->
  <rect x="200" y="502" width="220" height="50" rx="25" fill="#fff3e0" stroke="#e65100"/>
  <text x="310" y="523" text-anchor="middle" font-weight="bold" fill="#222">db : 5432</text>
  <text x="310" y="541" text-anchor="middle" font-size="11" fill="#666">ClusterIP — internal</text>
  <rect x="440" y="498" width="390" height="58" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="512" font-size="10" fill="#1565c0">StatefulSet db ×1 (fixed name, own disk)</text>
  <rect x="450" y="518" width="190" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="545" y="539" text-anchor="middle" font-size="12" fill="#222">pod db-0: PostgreSQL</text>
  <rect x="660" y="518" width="160" height="32" rx="4" fill="#f4f6f8" stroke="#555"/>
  <text x="740" y="539" text-anchor="middle" font-size="12" fill="#222">disk (2 GB PVC)</text>
  <text x="850" y="523" font-size="12" fill="#222">api, worker, migrate</text>
  <text x="850" y="541" font-size="11" fill="#888">data survives a restart</text>

  <!-- row 7 worker + migrate -->
  <rect x="200" y="572" width="220" height="70" rx="8" fill="#ffffff" stroke="#bbb" stroke-dasharray="3,3"/>
  <text x="310" y="600" text-anchor="middle" font-size="12" fill="#666">no Service:</text>
  <text x="310" y="618" text-anchor="middle" font-size="12" fill="#666">nobody calls these</text>
  <rect x="440" y="568" width="190" height="78" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="448" y="582" font-size="10" fill="#1565c0">Deployment worker ×1</text>
  <rect x="450" y="590" width="170" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="535" y="611" text-anchor="middle" font-size="12" fill="#222">pod: worker</text>
  <text x="450" y="638" font-size="10" fill="#888">reads new uploads from db</text>
  <rect x="640" y="568" width="190" height="78" fill="none" stroke="#1565c0" stroke-dasharray="4,3"/>
  <text x="648" y="582" font-size="10" fill="#1565c0">Job migrate (runs once)</text>
  <rect x="650" y="590" width="170" height="32" fill="#e8f0fe" stroke="#1565c0"/>
  <text x="735" y="611" text-anchor="middle" font-size="12" fill="#222">pod: create tables</text>
  <text x="650" y="638" font-size="10" fill="#888">Completed, then stops</text>
  <text x="850" y="600" font-size="12" fill="#222">they call others:</text>
  <text x="850" y="618" font-size="11" fill="#888">worker → db, embedding</text>
  <text x="850" y="634" font-size="11" fill="#888">migrate → db</text>

  <!-- bottom: how a call finds a pod -->
  <rect x="30" y="680" width="520" height="200" rx="8" fill="#fafbfc" stroke="#ccc"/>
  <text x="46" y="704" font-weight="bold" fill="#222">How one pod reaches another</text>
  <text x="46" y="730" font-size="12" fill="#333">1. Code calls a name, e.g. http://model-service:8001</text>
  <text x="46" y="752" font-size="12" fill="#333">2. Kubernetes' DNS turns the name into the Service's address</text>
  <text x="46" y="774" font-size="12" fill="#333">3. The Service sends it to a pod that passed its readiness check</text>
  <text x="46" y="796" font-size="12" fill="#333">4. If a pod dies, its Deployment starts a new one; the name</text>
  <text x="46" y="814" font-size="12" fill="#333">   stays the same, so nobody has to change anything</text>
  <text x="46" y="844" font-size="11" fill="#888">Settings come from a ConfigMap, passwords and keys from a Secret,</text>
  <text x="46" y="860" font-size="11" fill="#888">both given to the pods as environment variables (k8s/config.yaml).</text>

  <rect x="570" y="680" width="500" height="200" rx="8" fill="#fafbfc" stroke="#ccc"/>
  <text x="586" y="704" font-weight="bold" fill="#222">One question, from outside to inside</text>
  <text x="586" y="730" font-size="12" fill="#e65100">1. Browser → web Service (NodePort 30080) → web pod</text>
  <text x="586" y="752" font-size="12" fill="#1565c0">2. web pod → api Service → one of the 3 api pods</text>
  <text x="586" y="774" font-size="12" fill="#1565c0">3. api pod → redis (allowed?) → embedding-service</text>
  <text x="586" y="796" font-size="12" fill="#1565c0">4. api pod → db: find the closest chunks (pgvector)</text>
  <text x="586" y="818" font-size="12" fill="#1565c0">5. api pod → model-service: write the answer</text>
  <text x="586" y="840" font-size="12" fill="#1565c0">6. the answer streams back the same way</text>
  <text x="586" y="864" font-size="11" fill="#888">Orange = crosses the cluster edge. Blue = stays inside.</text>
</svg>

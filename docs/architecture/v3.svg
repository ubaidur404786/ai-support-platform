<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1020" height="720" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">v3 — Pagination</text>
  <text x="30" y="56" fill="#555">No new technology. The caller no longer decides how much work the server does: every list request is bounded.</text>

  <!-- Request -->
  <rect x="30" y="86" width="230" height="74" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="145" y="108" text-anchor="middle" font-weight="bold" fill="#222" font-size="12">Client</text>
  <text x="145" y="130" text-anchor="middle" font-family="Consolas, monospace" fill="#333" font-size="11">GET /tickets?label=billing</text>
  <text x="145" y="147" text-anchor="middle" font-family="Consolas, monospace" fill="#333" font-size="11">&amp;limit=50&amp;offset=100</text>

  <line x1="260" y1="123" x2="310" y2="123" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="310" y="82" width="300" height="82" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="322" y="104" font-weight="bold" fill="#222" font-size="12">router.py — THE EDGE</text>
  <text x="322" y="124" fill="#333" font-size="11">Query(ge=1, le=max_page_size)</text>
  <text x="322" y="141" fill="#333" font-size="11">rejects limit=500 with 422 before</text>
  <text x="322" y="156" fill="#333" font-size="11">any code below this line runs</text>

  <rect x="630" y="82" width="360" height="82" rx="6" fill="#fdf0ef" stroke="#c62828" stroke-width="1.5"/>
  <text x="642" y="104" font-weight="bold" fill="#222" font-size="12">Why a ceiling, not just a default</text>
  <text x="642" y="124" fill="#333" font-size="11">An unbounded list is a denial-of-service surface:</text>
  <text x="642" y="141" fill="#333" font-size="11">one request could occupy a worker for seconds.</text>
  <text x="642" y="156" fill="#333" font-size="11">The caller must never choose the server's workload.</text>

  <path d="M 460 164 L 460 186" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="470" y="180" fill="#666" font-size="11">limit=50, offset=100</text>

  <!-- Service -->
  <rect x="310" y="188" width="300" height="96" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="322" y="210" font-weight="bold" fill="#222" font-size="12">service.py — THE POLICY</text>
  <text x="322" y="230" fill="#333" font-size="11">limit is None → default_page_size</text>
  <text x="322" y="247" fill="#333" font-size="11">limit = max(1, min(limit, max_page_size))</text>
  <text x="322" y="264" fill="#333" font-size="11">returns TicketPage(items, total, limit, offset)</text>
  <text x="322" y="278" fill="#666" font-size="10">clamps again: a worker or CLI has no HTTP validation in front of it</text>

  <rect x="630" y="188" width="360" height="96" rx="6" fill="#fafbfc" stroke="#999" stroke-dasharray="5,3"/>
  <text x="642" y="210" font-weight="bold" fill="#222" font-size="12">Defence in depth</text>
  <text x="642" y="230" fill="#333" font-size="11">The router protects HTTP callers.</text>
  <text x="642" y="247" fill="#333" font-size="11">The service protects itself from every caller.</text>
  <text x="642" y="268" fill="#666" font-size="11">A limit enforced at one layer only is a limit that</text>
  <text x="642" y="282" fill="#666" font-size="11">disappears the moment someone bypasses that layer.</text>

  <path d="M 460 284 L 460 306" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Repository -->
  <rect x="310" y="308" width="300" height="104" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="322" y="330" font-weight="bold" fill="#222" font-size="12">repository.py — THE TRANSLATION</text>
  <text x="322" y="352" font-family="Consolas, monospace" fill="#333" font-size="10">SELECT * … WHERE label=$1</text>
  <text x="322" y="368" font-family="Consolas, monospace" fill="#333" font-size="10">ORDER BY id LIMIT 50 OFFSET 100</text>
  <text x="322" y="388" font-family="Consolas, monospace" fill="#333" font-size="10">SELECT count(*) … WHERE label=$1</text>
  <text x="322" y="404" fill="#666" font-size="10">_filtered() is shared, so page and total can never disagree</text>

  <rect x="630" y="308" width="360" height="104" rx="6" fill="#fafbfc" stroke="#999" stroke-dasharray="5,3"/>
  <text x="642" y="330" font-weight="bold" fill="#222" font-size="12">Two queries, not one</text>
  <text x="642" y="350" fill="#333" font-size="11">len(items) is at most `limit`, so it cannot answer</text>
  <text x="642" y="366" fill="#333" font-size="11">"how many exist". total needs its own COUNT.</text>
  <text x="642" y="388" fill="#c62828" font-size="11">Measured: the COUNT costs 60x the page query.</text>
  <text x="642" y="404" fill="#666" font-size="10">ORDER BY id is required: without a stable sort, pages overlap.</text>

  <path d="M 460 412 L 460 434" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="310" y="436" width="300" height="46" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="464" text-anchor="middle" font-weight="bold" fill="#222" font-size="12">PostgreSQL</text>

  <!-- Measurements -->
  <text x="30" y="524" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MEASURED LOCALLY — 13,000 ROWS, SAME DATA AS v2</text>

  <rect x="30" y="538" width="300" height="88" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="42" y="558" font-size="12" fill="#222"><tspan font-weight="bold">The fix</tspan></text>
  <text x="42" y="578" font-size="12" fill="#222">v2 unpaged, 13,000 rows   2180 ms</text>
  <text x="42" y="596" font-size="12" fill="#222">v3 page of 50 (warm)         ~90 ms</text>
  <text x="42" y="616" font-size="11" fill="#666">Work no longer grows with the table.</text>

  <rect x="350" y="538" width="320" height="88" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="362" y="558" font-size="12" fill="#222"><tspan font-weight="bold">OFFSET walks rows it throws away</tspan></text>
  <text x="362" y="578" font-size="12" fill="#222">OFFSET 0      → 50 rows scanned, 0.36 ms</text>
  <text x="362" y="596" font-size="12" fill="#222">OFFSET 12900  → 12,950 scanned, 6.17 ms</text>
  <text x="362" y="616" font-size="11" fill="#666">Same 50 rows returned; 17x the work.</text>

  <rect x="690" y="538" width="300" height="88" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="702" y="558" font-size="12" fill="#222"><tspan font-weight="bold">The unexpected cost</tspan></text>
  <text x="702" y="578" font-size="12" fill="#222">page query      0.36 ms</text>
  <text x="702" y="596" font-size="12" fill="#222">COUNT(*)       22.3 ms</text>
  <text x="702" y="616" font-size="11" fill="#666">total costs far more than the data itself.</text>

  <rect x="30" y="640" width="960" height="60" rx="4" fill="#fdf0ef" stroke="#c62828"/>
  <text x="42" y="660" font-size="12" fill="#222"><tspan font-weight="bold">Next limitations, both measured:</tspan></text>
  <text x="42" y="678" font-size="12" fill="#222">1. Deep pages degrade linearly — keyset pagination (WHERE id &gt; last_seen) replaces OFFSET when depth starts to hurt.</text>
  <text x="42" y="694" font-size="12" fill="#222">2. total dominates the request — make it optional, cache it, or estimate it. Not yet fixed: 22 ms is still cheap enough.</text>
</svg>

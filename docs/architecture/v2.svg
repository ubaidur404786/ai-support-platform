<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="740" viewBox="0 0 1020 740" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="1020" height="740" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#222">v2 — PostgreSQL</text>
  <text x="30" y="56" fill="#555">State moves out of the API process. The application is now stateless; the database is the system of record.</text>
  <text x="30" y="76" fill="#555">Nothing above the repository changed: the service and router were written against an interface in v1 and did not notice.</text>

  <!-- Clients -->
  <rect x="30" y="112" width="140" height="70" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="138" text-anchor="middle" font-weight="bold" fill="#222" font-size="12">Client</text>
  <text x="100" y="160" text-anchor="middle" fill="#333" font-size="11">POST /tickets</text>
  <text x="100" y="174" text-anchor="middle" fill="#333" font-size="11">GET /tickets</text>

  <line x1="170" y1="147" x2="215" y2="147" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API process A -->
  <rect x="215" y="100" width="300" height="200" rx="8" fill="#fafbfc" stroke="#999" stroke-dasharray="6,4"/>
  <text x="228" y="120" font-size="11" font-weight="bold" fill="#888">API PROCESS (stateless - holds no tickets)</text>

  <rect x="232" y="130" width="266" height="34" rx="4" fill="#e8f0fe" stroke="#333"/>
  <text x="242" y="152" fill="#222" font-size="12"><tspan font-weight="bold">router.py</tspan>  ·  422 / 404 / 503 / 500</text>

  <rect x="232" y="170" width="266" height="34" rx="4" fill="#e8f0fe" stroke="#333"/>
  <text x="242" y="192" fill="#222" font-size="12"><tspan font-weight="bold">service.py</tspan>  ·  classify, flag, store</text>

  <rect x="232" y="210" width="266" height="34" rx="4" fill="#e8f0fe" stroke="#333"/>
  <text x="242" y="232" fill="#222" font-size="12"><tspan font-weight="bold">repository.py</tspan>  ·  PostgresTicketRepository</text>

  <rect x="232" y="250" width="266" height="34" rx="4" fill="#e6f4ea" stroke="#333"/>
  <text x="242" y="272" fill="#222" font-size="12"><tspan font-weight="bold">classifier</tspan>  ·  in-process, 1.7 ms</text>

  <path d="M 365 164 L 365 170" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 365 204 L 365 210" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 440 204 L 470 204 L 470 250" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- API process B (replica) -->
  <rect x="215" y="320" width="300" height="90" rx="8" fill="#fafbfc" stroke="#999" stroke-dasharray="6,4"/>
  <text x="228" y="340" font-size="11" font-weight="bold" fill="#888">ANOTHER API PROCESS — same code, same data</text>
  <text x="365" y="364" text-anchor="middle" fill="#333" font-size="12">a second worker or replica now sees</text>
  <text x="365" y="382" text-anchor="middle" fill="#333" font-size="12">every ticket the first one wrote</text>
  <text x="365" y="400" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">this is what v1 could not do</text>

  <!-- arrows to DB -->
  <path d="M 515 227 L 600 227" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="557" y="218" text-anchor="middle" font-size="11" fill="#333">SQL</text>
  <text x="557" y="243" text-anchor="middle" font-size="10" fill="#666">pooled connections</text>

  <path d="M 515 365 L 600 365 L 600 300" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- PostgreSQL -->
  <rect x="600" y="140" width="250" height="160" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="725" y="166" text-anchor="middle" font-weight="bold" fill="#222">PostgreSQL</text>
  <text x="725" y="184" text-anchor="middle" fill="#555" font-size="11">the system of record</text>
  <text x="614" y="210" fill="#333" font-size="11">· survives process restarts</text>
  <text x="614" y="228" fill="#333" font-size="11">· shared by every API process</text>
  <text x="614" y="246" fill="#333" font-size="11">· assigns ids from a sequence</text>
  <text x="614" y="264" fill="#333" font-size="11">· filters and sorts with indexes</text>
  <text x="614" y="282" fill="#333" font-size="11">· one commit = one durable write</text>

  <!-- Alembic -->
  <rect x="880" y="140" width="110" height="160" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="935" y="166" text-anchor="middle" font-weight="bold" fill="#222" font-size="12">Alembic</text>
  <text x="935" y="190" text-anchor="middle" fill="#555" font-size="11">versioned</text>
  <text x="935" y="205" text-anchor="middle" fill="#555" font-size="11">schema</text>
  <text x="935" y="220" text-anchor="middle" fill="#555" font-size="11">changes</text>
  <text x="935" y="248" text-anchor="middle" fill="#666" font-size="10">runs before</text>
  <text x="935" y="262" text-anchor="middle" fill="#666" font-size="10">the app starts</text>
  <text x="935" y="284" text-anchor="middle" fill="#666" font-size="10">tests use it too</text>
  <line x1="880" y1="220" x2="850" y2="220" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- failure handling -->
  <text x="30" y="452" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">FAILURE HANDLING — WHAT HAPPENS WHEN THE DATABASE IS NOT THERE</text>

  <rect x="30" y="466" width="300" height="76" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="42" y="488" font-weight="bold" fill="#222" font-size="12">Query fails</text>
  <text x="42" y="508" fill="#333" font-size="11">SQLAlchemyError → rollback →</text>
  <text x="42" y="524" fill="#333" font-size="11">StorageError → HTTP 503 "retry later"</text>

  <rect x="350" y="466" width="300" height="76" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="362" y="488" font-weight="bold" fill="#222" font-size="12">Database unreachable</text>
  <text x="362" y="508" fill="#333" font-size="11">/health returns 200 with</text>
  <text x="362" y="524" fill="#333" font-size="11">status "degraded", database_reachable false</text>

  <rect x="670" y="466" width="320" height="76" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="682" y="488" font-weight="bold" fill="#222" font-size="12">Connection died while idle</text>
  <text x="682" y="508" fill="#333" font-size="11">pool_pre_ping tests it first and</text>
  <text x="682" y="524" fill="#333" font-size="11">replaces it, instead of failing a real request</text>

  <!-- measurements -->
  <text x="30" y="578" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MEASURED LOCALLY, SAME SESSION — 1000 REQUESTS PER RUN</text>

  <rect x="30" y="592" width="470" height="96" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="42" y="612" font-size="12" fill="#222"><tspan font-weight="bold">Cost of durability</tspan> (concurrency 1)</text>
  <text x="42" y="632" font-size="12" fill="#222">v1 /tickets, in memory   48.6 req/s   P50 19.4 ms</text>
  <text x="42" y="650" font-size="12" fill="#222">v2 /tickets, PostgreSQL  27.6 req/s   P50 33.9 ms</text>
  <text x="42" y="668" font-size="12" fill="#222">v2 /classify, no database 50.0 req/s  P50 16.1 ms</text>
  <text x="42" y="684" font-size="11" fill="#666">+14.5 ms per write. Unchanged where nothing is written.</text>

  <rect x="520" y="592" width="470" height="96" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="532" y="612" font-size="12" fill="#222"><tspan font-weight="bold">What the shared database bought</tspan></text>
  <text x="532" y="632" font-size="12" fill="#222">3006 rows written concurrently, 3006 distinct ids</text>
  <text x="532" y="650" font-size="12" fill="#222">concurrency 1 → 10 raises throughput 27.6 → 44.5 req/s</text>
  <text x="532" y="666" font-size="11" fill="#666">(waiting on the database releases the GIL, so threads overlap)</text>
  <text x="532" y="684" font-size="11" fill="#666">Index used for label; 13,006 rows scanned without one for needs_review.</text>

  <rect x="30" y="700" width="960" height="30" rx="4" fill="#fdf0ef" stroke="#c62828"/>
  <text x="42" y="720" font-size="12" fill="#222"><tspan font-weight="bold">Next limitation, measured:</tspan> GET /tickets has no paging — with 13,006 rows it returned every one of them and took 2.18 s.</text>
</svg>

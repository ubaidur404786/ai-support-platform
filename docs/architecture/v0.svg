<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#222">v0 — Baseline</text>
  <text x="30" y="58" fill="#555">One process. The API validates the request, runs the classifier in-process, and returns JSON.</text>

  <!-- Request flow label -->
  <text x="30" y="100" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">REQUEST FLOW</text>

  <!-- Client -->
  <rect x="30" y="120" width="180" height="120" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="147" text-anchor="middle" font-weight="bold" fill="#222">Client</text>
  <text x="120" y="170" text-anchor="middle" fill="#555" font-size="12">browser / curl / tests</text>
  <text x="120" y="200" text-anchor="middle" fill="#333" font-size="12">sends a support ticket</text>
  <text x="120" y="216" text-anchor="middle" fill="#333" font-size="12">as plain text</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="180" x2="280" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="168" text-anchor="middle" font-size="11" fill="#333">POST /classify</text>

  <!-- FastAPI -->
  <rect x="280" y="120" width="210" height="120" rx="6" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="147" text-anchor="middle" font-weight="bold" fill="#222">FastAPI service</text>
  <text x="385" y="165" text-anchor="middle" fill="#555" font-size="12">app/main.py</text>
  <text x="385" y="190" text-anchor="middle" fill="#333" font-size="12">validates input (Pydantic)</text>
  <text x="385" y="206" text-anchor="middle" fill="#333" font-size="12">routes /classify and /health</text>
  <text x="385" y="222" text-anchor="middle" fill="#333" font-size="12">returns controlled errors</text>

  <!-- Arrow 2 -->
  <line x1="490" y1="180" x2="560" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="168" text-anchor="middle" font-size="11" fill="#333">predict(text)</text>

  <!-- Classifier -->
  <rect x="560" y="120" width="210" height="120" rx="6" fill="#e6f4ea" stroke="#333" stroke-width="1.5"/>
  <text x="665" y="147" text-anchor="middle" font-weight="bold" fill="#222">Ticket classifier</text>
  <text x="665" y="165" text-anchor="middle" fill="#555" font-size="12">app/classifier.py</text>
  <text x="665" y="190" text-anchor="middle" fill="#333" font-size="12">TF-IDF + Logistic Regression</text>
  <text x="665" y="206" text-anchor="middle" fill="#333" font-size="12">loaded once at startup</text>
  <text x="665" y="222" text-anchor="middle" fill="#333" font-size="12">runs inside the API process</text>

  <!-- Arrow 3 -->
  <line x1="770" y1="180" x2="840" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="805" y="168" text-anchor="middle" font-size="11" fill="#333">label + confidence</text>

  <!-- Response -->
  <rect x="840" y="120" width="110" height="120" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="895" y="147" text-anchor="middle" font-weight="bold" fill="#222">Response</text>
  <text x="895" y="165" text-anchor="middle" fill="#555" font-size="12">JSON</text>
  <text x="895" y="196" text-anchor="middle" fill="#333" font-size="12">200 / 422 / 503</text>

  <!-- Example request / response -->
  <rect x="30" y="262" width="440" height="58" rx="4" fill="#fafafa" stroke="#bbb" stroke-dasharray="3,3"/>
  <text x="42" y="282" font-size="11" fill="#888" font-weight="bold">Example request</text>
  <text x="42" y="302" font-family="Consolas, monospace" font-size="12" fill="#222">{"text": "I was charged twice for my subscription"}</text>

  <rect x="510" y="262" width="440" height="58" rx="4" fill="#fafafa" stroke="#bbb" stroke-dasharray="3,3"/>
  <text x="522" y="282" font-size="11" fill="#888" font-weight="bold">Example response</text>
  <text x="522" y="302" font-family="Consolas, monospace" font-size="12" fill="#222">{"label": "billing", "confidence": 0.72, "model_version": "v0.1.0"}</text>

  <!-- Training flow label -->
  <text x="30" y="368" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">TRAINING FLOW (offline, before the server starts)</text>

  <!-- Dataset -->
  <rect x="30" y="385" width="230" height="80" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="145" y="410" text-anchor="middle" font-weight="bold" fill="#222">Labelled dataset</text>
  <text x="145" y="428" text-anchor="middle" fill="#555" font-size="12">ml/data/tickets.csv</text>
  <text x="145" y="448" text-anchor="middle" fill="#333" font-size="12">200 tickets, 4 labels, 50 each</text>

  <line x1="260" y1="425" x2="320" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Train script -->
  <rect x="320" y="385" width="230" height="80" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="435" y="410" text-anchor="middle" font-weight="bold" fill="#222">Train + evaluate</text>
  <text x="435" y="428" text-anchor="middle" fill="#555" font-size="12">ml/train.py</text>
  <text x="435" y="448" text-anchor="middle" fill="#333" font-size="12">75/25 split, accuracy, F1</text>

  <line x1="550" y1="425" x2="610" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Artifact -->
  <rect x="610" y="385" width="230" height="80" rx="6" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="725" y="410" text-anchor="middle" font-weight="bold" fill="#222">Model artifact</text>
  <text x="725" y="428" text-anchor="middle" fill="#555" font-size="12">models/ticket_classifier.joblib</text>
  <text x="725" y="448" text-anchor="middle" fill="#333" font-size="12">pipeline + version + metadata</text>

  <!-- Dashed arrow from artifact up to classifier -->
  <path d="M 725 385 L 725 350 L 665 350 L 665 240" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="700" y="345" text-anchor="end" font-size="11" fill="#777">loaded at startup</text>

  <!-- Footer / measured -->
  <rect x="30" y="490" width="920" height="50" rx="4" fill="#f4f6f8" stroke="#ccc"/>
  <text x="42" y="510" font-size="12" fill="#222"><tspan font-weight="bold">Measured locally (single uvicorn process, Windows laptop):</tspan> inference 1.7 ms · HTTP round-trip P50 12 ms · ~80 req/s ceiling.</text>
  <text x="42" y="528" font-size="12" fill="#222"><tspan font-weight="bold">Known limitation:</tspan> inference runs serially inside the API process; concurrent clients queue instead of scaling (P50 134 ms at concurrency 10).</text>
</svg>

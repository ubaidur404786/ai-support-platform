# nginx serves the built web page and forwards /api/... to the API.
#
# This makes the web app the ONE public entry point: the browser talks only
# to nginx, and nginx talks to the API on the internal network. Same origin
# for page and API, so no CORS settings are needed.

server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # The trailing "/" removes the /api prefix: /api/health -> /health.
        # "api" is the name of the API's service in Docker Compose and Kubernetes.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Answers can take a minute on a CPU, and the stream must reach the
        # browser line by line, not all at once at the end.
        proxy_read_timeout 180s;
        proxy_buffering off;
        # Documents up to 5 MB (the API's own limit is MAX_DOCUMENT_BYTES).
        client_max_body_size 6m;
    }

    location / {
        try_files $uri /index.html;
    }
}

# nginx: the load balancer. The only container users can reach.
# This file lives on your disk and is mounted into the container
# (see docker-compose.yml), so you edit it here, not inside the image.

events {
    worker_connections 1024;
}

http {
    # The group of gateways nginx can send a request to.
    # nginx resolves each name through Docker's DNS when it starts.
    # Default rule: round robin (1st request -> first, 2nd -> next, ...).
    upstream gateways {
        server gateway1:8000;
        # Step 2 uses nginx/step2.conf, which lists three gateways.

        keepalive 32;  # reuse connections to gateways
    }

    server {
        listen 80;

        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Shows which gateway address nginx picked for this request.
            add_header X-Upstream $upstream_addr always;
        }
    }
}

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1060" height="530" viewBox="0 0 1060 530" font-family="Arial, Helvetica, sans-serif" font-size="13">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker>
 <symbol id="i-user" viewBox="0 0 32 32"><circle cx="16" cy="10" r="6" fill="#444"/><path d="M4,30 C4,19 28,19 28,30 z" fill="#444"/></symbol>
 <symbol id="i-lb" viewBox="0 0 32 32"><circle cx="6" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="5" r="4" fill="#1a56db"/><circle cx="26" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="27" r="4" fill="#1a56db"/><path d="M10,16 L22,5 M10,16 L22,16 M10,16 L22,27" stroke="#1a56db" stroke-width="2.5"/></symbol>
 <symbol id="i-gate" viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="27" rx="2" fill="none" stroke="#6250d6" stroke-width="3"/><rect x="11" y="12" width="10" height="18" fill="#6250d6"/><circle cx="16" cy="8" r="2" fill="#6250d6"/></symbol>
 <symbol id="i-svc" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#1baf7a" stroke-width="5" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="4" fill="#1baf7a"/></symbol>
 <symbol id="i-db" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100"/><path d="M4,6 V26 C4,31 28,31 28,26 V6" fill="#f6c453" stroke="#c98500" stroke-width="1.5"/><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100" stroke="#c98500" stroke-width="1.5"/><path d="M4,16 C4,20 28,20 28,16" fill="none" stroke="#c98500" stroke-width="1.5"/></symbol>
 <symbol id="i-copy" viewBox="0 0 32 32"><path d="M6,16 A10,10 0 1 1 16,26" fill="none" stroke="#1baf7a" stroke-width="3"/><path d="M11,26 L16,26 L16,21" fill="none" stroke="#1baf7a" stroke-width="3"/></symbol>
 <symbol id="i-cpu" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" rx="2" fill="#c81e1e"/><path d="M12,3 V8 M20,3 V8 M12,24 V29 M20,24 V29 M3,12 H8 M3,20 H8 M24,12 H29 M24,20 H29" stroke="#c81e1e" stroke-width="2"/></symbol>
 <symbol id="i-file" viewBox="0 0 32 32"><path d="M7,3 H20 L26,9 V29 H7 z" fill="#fff" stroke="#444" stroke-width="2"/><path d="M11,14 H22 M11,19 H22 M11,24 H18" stroke="#444" stroke-width="2"/></symbol>
 <symbol id="i-net" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#444" stroke-width="2"/><path d="M4,16 H28 M16,4 C9,10 9,22 16,28 M16,4 C23,10 23,22 16,28" fill="none" stroke="#444" stroke-width="2"/></symbol>
</defs><rect width="1060" height="530" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">Step 3: database replication (read replicas)</text><text x="20" y="56" fill="#52514e">One primary takes every write and streams it to two read-only copies</text><rect x="20" y="110" width="200" height="110" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="30" y="120" width="30" height="30"/><text x="68" y="140" font-weight="bold" fill="#0b0b0b">tickets-service</text><text x="32" y="166" font-size="12" fill="#52514e">POST /tickets -> primary</text><text x="32" y="183" font-size="12" fill="#52514e">GET /stats -> replica</text><text x="32" y="200" font-size="12" fill="#52514e">(round robin)</text><rect x="320" y="90" width="220" height="90" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="330" y="100" width="30" height="30"/><text x="368" y="120" font-weight="bold" fill="#0b0b0b">db (primary)</text><text x="332" y="146" font-size="12" fill="#52514e">reads + writes</text><rect x="320" y="230" width="220" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-copy" xlink:href="#i-copy" x="330" y="240" width="30" height="30"/><text x="368" y="260" font-weight="bold" fill="#0b0b0b">db-replica-1</text><text x="332" y="286" font-size="12" fill="#52514e">read only</text><rect x="580" y="230" width="220" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-copy" xlink:href="#i-copy" x="590" y="240" width="30" height="30"/><text x="628" y="260" font-weight="bold" fill="#0b0b0b">db-replica-2</text><text x="592" y="286" font-size="12" fill="#52514e">read only</text><line x1="220" y1="140" x2="318" y2="130" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="269.0" y="129.0" text-anchor="middle" font-size="11" fill="#52514e">writes</text><line x1="220" y1="190" x2="318" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="269.0" y="219.0" text-anchor="middle" font-size="11" fill="#52514e">reads</text><line x1="220" y1="205" x2="578" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="430" y1="180" x2="430" y2="228" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="430.0" y="204.0" text-anchor="middle" font-size="11" fill="#52514e">WAL</text><line x1="540" y1="150" x2="690" y2="228" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="615.0" y="183.0" text-anchor="middle" font-size="11" fill="#52514e">changes stream</text><rect x="840" y="90" width="200" height="210" rx="8" fill="#fde8e8" stroke="#c81e1e"/><text x="940" y="125" text-anchor="middle" font-weight="bold" fill="#c81e1e">GET /stats, 50 users</text><text x="940" y="175" text-anchor="middle" font-size="20" font-weight="bold">13 -> 13</text><text x="940" y="198" text-anchor="middle">req/s (1 db -> 2 replicas)</text><text x="940" y="240" text-anchor="middle">P50 5,494 -> 5,163 ms</text><rect x="20" y="330" width="1020" height="186" rx="8" fill="#f4f4f2" stroke="#888"/><text x="34" y="352" font-weight="bold" fill="#0b0b0b">Replication: why and when</text><text x="34" y="372" fill="#0b0b0b">WHY: many more reads than writes, and the reads are heavy. One database's CPU becomes the line. A replica is a full, read-only copy,</text><text x="34" y="390" fill="#0b0b0b">so heavy reads are spread over more machines. It is also a standby: if the primary dies, a replica can be promoted.</text><text x="34" y="408" fill="#0b0b0b">COST: a replica is a little behind (replication lag). Read your own write from the primary, not a replica.</text><text x="34" y="426" fill="#0b0b0b">WHEN NOT: if writes are the problem (replicas copy every write, so they do not help), or if one database is not busy yet.</text><text x="34" y="444" fill="#0b0b0b">MEASURED HERE: no gain. Both replicas ran at 100% CPU, but each query got slower, because all 3 databases share ONE laptop.</text><text x="34" y="462" fill="#0b0b0b">Replication adds capacity only when the copies run on separate machines (separate CPU, memory and disk) - that is the AWS step.</text></svg>
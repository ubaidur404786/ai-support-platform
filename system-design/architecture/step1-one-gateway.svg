<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">v18 step 1: one gateway (the starting point)</text>
  <text x="20" y="54" fill="#555">Question: what happens to latency when more users arrive, and which box is the bottleneck?</text>

  <!-- column labels -->
  <g fill="#777" font-size="12">
    <text x="40" y="92">USER</text><text x="200" y="92">LOAD BALANCER</text><text x="400" y="92">GATEWAY</text>
    <text x="600" y="92">SERVICES</text><text x="830" y="92">DATABASE</text>
  </g>

  <!-- boxes -->
  <rect x="20" y="150" width="140" height="80" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="90" y="182" text-anchor="middle" font-weight="bold">Browser / loadtest</text>
  <text x="90" y="202" text-anchor="middle" font-size="12">GET /api/tickets/7</text>

  <rect x="200" y="140" width="160" height="100" rx="6" fill="#e8f0fe" stroke="#1a56db"/>
  <text x="280" y="168" text-anchor="middle" font-weight="bold">nginx</text>
  <text x="280" y="188" text-anchor="middle" font-size="12">nginx/nginx.conf</text>
  <text x="280" y="206" text-anchor="middle" font-size="12">upstream: gateway1</text>
  <text x="280" y="224" text-anchor="middle" font-size="12">port 8090 -&gt; 80</text>

  <rect x="400" y="140" width="160" height="100" rx="6" fill="#e8f0fe" stroke="#1a56db"/>
  <text x="480" y="168" text-anchor="middle" font-weight="bold">gateway1</text>
  <text x="480" y="188" text-anchor="middle" font-size="12">gateway/main.py</text>
  <text x="480" y="206" text-anchor="middle" font-size="12">/api/users -&gt; users</text>
  <text x="480" y="224" text-anchor="middle" font-size="12">/api/tickets -&gt; tickets</text>

  <rect x="600" y="110" width="190" height="70" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="695" y="136" text-anchor="middle" font-weight="bold">users-service :8001</text>
  <text x="695" y="156" text-anchor="middle" font-size="12">reads a user (waits on DB)</text>

  <rect x="600" y="210" width="190" height="70" rx="6" fill="#fde8e8" stroke="#c81e1e"/>
  <text x="695" y="236" text-anchor="middle" font-weight="bold">tickets-service :8002</text>
  <text x="695" y="256" text-anchor="middle" font-size="12">reads + classifies (CPU ~50 ms)</text>

  <rect x="830" y="150" width="130" height="80" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="895" y="182" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="895" y="202" text-anchor="middle" font-size="12">db:5432</text>

  <!-- arrows -->
  <line x1="160" y1="190" x2="198" y2="190" stroke="#333" marker-end="url(#a)"/>
  <line x1="360" y1="190" x2="398" y2="190" stroke="#333" marker-end="url(#a)"/>
  <line x1="560" y1="175" x2="598" y2="148" stroke="#333" marker-end="url(#a)"/>
  <line x1="560" y1="205" x2="598" y2="242" stroke="#333" marker-end="url(#a)"/>
  <line x1="790" y1="148" x2="828" y2="175" stroke="#333" marker-end="url(#a)"/>
  <line x1="790" y1="242" x2="828" y2="205" stroke="#333" marker-end="url(#a)"/>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#555">Containers find each other by NAME (Docker DNS): http://gateway1:8000, http://tickets-service:8002, db:5432.</text>
  <text x="380" y="308" text-anchor="middle" font-size="12" fill="#555">Only nginx publishes a port. Every app container is limited to 1 CPU, like one small server.</text>

  <!-- measurements -->
  <text x="20" y="352" font-weight="bold" font-size="15">Measured: GET /api/tickets/{id}, 15 s per level, laptop, Docker Desktop</text>
  <g font-size="13">
    <rect x="20" y="364" width="940" height="28" fill="#f2f2f2" stroke="#999"/>
    <text x="40" y="383" font-weight="bold">users</text><text x="200" y="383" font-weight="bold">requests / s</text><text x="400" y="383" font-weight="bold">P50 latency</text><text x="600" y="383" font-weight="bold">P95 latency</text>
    <rect x="20" y="392" width="940" height="26" fill="#fff" stroke="#999"/>
    <text x="40" y="410">1</text><text x="200" y="410">14.5</text><text x="400" y="410">61 ms</text><text x="600" y="410">94 ms</text>
    <rect x="20" y="418" width="940" height="26" fill="#fff" stroke="#999"/>
    <text x="40" y="436">10</text><text x="200" y="436">20.5</text><text x="400" y="436">495 ms</text><text x="600" y="436">590 ms</text>
    <rect x="20" y="444" width="940" height="26" fill="#fff" stroke="#999"/>
    <text x="40" y="462">50</text><text x="200" y="462">20.8</text><text x="400" y="462">2,605 ms</text><text x="600" y="462">3,542 ms</text>
    <rect x="20" y="470" width="940" height="26" fill="#fff" stroke="#999"/>
    <text x="40" y="488">100</text><text x="200" y="488">24.6</text><text x="400" y="488">5,165 ms</text><text x="600" y="488">6,075 ms</text>
  </g>

  <rect x="20" y="512" width="940" height="56" rx="6" fill="#fde8e8" stroke="#c81e1e"/>
  <text x="36" y="535" font-weight="bold" fill="#c81e1e">Problem: throughput stays at ~20 req/s; more users only wait longer in line.</text>
  <text x="36" y="555">During the test tickets-service used 93% of its 1 CPU; gateway1 used 13%. Wait time = users / throughput (100 / 20 = 5 s).</text>

  <rect x="20" y="578" width="940" height="48" rx="6" fill="#e8f0fe" stroke="#1a56db"/>
  <text x="36" y="600" font-weight="bold" fill="#1a56db">Next (step 2): add copies (horizontal scaling) and measure which copies actually help:</text>
  <text x="36" y="618">more gateways only, or more tickets-service copies too.</text>
</svg>

</defs><rect width="1060" height="514" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">Docker Compose networking: names, ports and config</text><text x="20" y="56" fill="#52514e">One private network; names connect the parts</text><rect x="20" y="90" width="220" height="120" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-user" xlink:href="#i-user" x="30" y="100" width="30" height="30"/><text x="68" y="120" font-weight="bold" fill="#0b0b0b">Your machine</text><text x="32" y="146" font-size="12" fill="#52514e">browser: localhost:8090</text><text x="32" y="163" font-size="12" fill="#52514e">the only way in</text><rect x="280" y="80" width="760" height="360" rx="12" fill="none" stroke="#444" stroke-dasharray="6 4"/><use href="#i-net" xlink:href="#i-net" x="295" y="92" width="24" height="24"/><text x="326" y="109" font-weight="bold">Docker network "system-design_default" (private)</text><rect x="310" y="130" width="200" height="120" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-lb" xlink:href="#i-lb" x="320" y="140" width="30" height="30"/><text x="358" y="160" font-weight="bold" fill="#0b0b0b">nginx</text><text x="322" y="186" font-size="12" fill="#52514e">ports: "8090:80"</text><text x="322" y="203" font-size="12" fill="#52514e">upstream: gateway1..3</text><text x="322" y="220" font-size="12" fill="#52514e">nginx.conf mounted from disk</text><rect x="570" y="130" width="200" height="120" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="580" y="140" width="30" height="30"/><text x="618" y="160" font-weight="bold" fill="#0b0b0b">gateway1:8000</text><text x="582" y="186" font-size="12" fill="#52514e">no ports: line</text><text x="582" y="203" font-size="12" fill="#52514e">USERS_SERVICE_URL=</text><text x="582" y="220" font-size="12" fill="#52514e">  http://users-service:8001</text><rect x="820" y="120" width="200" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="830" y="130" width="30" height="30"/><text x="868" y="150" font-weight="bold" fill="#0b0b0b">users-service:8001</text><rect x="820" y="210" width="200" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="830" y="220" width="30" height="30"/><text x="868" y="240" font-weight="bold" fill="#0b0b0b">tickets-service:8002</text><rect x="820" y="330" width="200" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="830" y="340" width="30" height="30"/><text x="868" y="360" font-weight="bold" fill="#0b0b0b">db:5432</text><text x="832" y="386" font-size="12" fill="#52514e">DATABASE_URL=</text><text x="832" y="403" font-size="12" fill="#52514e">postgresql://...@db:5432</text><line x1="240" y1="150" x2="308" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="244" y="132" font-size="11" fill="#52514e">8090 -&gt; 80</text><line x1="510" y1="190" x2="568" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="539.0" y="184.0" text-anchor="middle" font-size="11" fill="#52514e">gateway1</text><line x1="770" y1="170" x2="818" y2="155" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="770" y1="210" x2="818" y2="245" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="920" y1="280" x2="920" y2="328" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="20" y="460" width="1020" height="34" rx="8" fill="#e8f0fe" stroke="#1a56db"/><text x="34" y="482" font-weight="bold" fill="#1a56db">Only nginx maps a port. Inside the network, every part is reached by its name.</text></svg>
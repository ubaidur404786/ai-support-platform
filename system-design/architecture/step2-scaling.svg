 <symbol id="i-file" viewBox="0 0 32 32"><path d="M7,3 H20 L26,9 V29 H7 z" fill="#fff" stroke="#444" stroke-width="2"/><path d="M11,14 H22 M11,19 H22 M11,24 H18" stroke="#444" stroke-width="2"/></symbol>
 <symbol id="i-net" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#444" stroke-width="2"/><path d="M4,16 H28 M16,4 C9,10 9,22 16,28 M16,4 C23,10 23,22 16,28" fill="none" stroke="#444" stroke-width="2"/></symbol>
</defs><rect width="1040" height="560" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">Step 2: horizontal scaling, measured</text><text x="20" y="56" fill="#52514e">GET /api/tickets/{id} with 100 users, 1 CPU per container, same laptop and session</text><text x="170" y="100" text-anchor="middle" font-size="15" font-weight="bold">1. one gateway</text><use href="#i-lb" xlink:href="#i-lb" x="155" y="115" width="30" height="30"/><text x="170" y="160" text-anchor="middle" font-size="11">nginx</text><line x1="170" y1="165" x2="170" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="155" y="190" width="30" height="30"/><text x="170" y="234" text-anchor="middle" font-size="11">gateway1</text><use href="#i-svc" xlink:href="#i-svc" x="155" y="265" width="30" height="30"/><text x="170" y="310" text-anchor="middle" font-size="11">tickets</text><use href="#i-cpu" xlink:href="#i-cpu" x="187" y="265" width="22" height="22"/><line x1="170" y1="240" x2="170" y2="263" stroke="#444"/><rect x="20" y="330" width="300" height="80" rx="8" fill="#fde8e8" stroke="#c81e1e"/><text x="170" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#c81e1e">26 req/s</text><text x="170" y="390" text-anchor="middle">P50 5,568 ms at 100 users</text><text x="520" y="100" text-anchor="middle" font-size="15" font-weight="bold">2a. three gateways</text><use href="#i-lb" xlink:href="#i-lb" x="505" y="115" width="30" height="30"/><text x="520" y="160" text-anchor="middle" font-size="11">nginx</text><line x1="520" y1="165" x2="425" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="410" y="190" width="30" height="30"/><text x="425" y="234" text-anchor="middle" font-size="11">gateway1</text><line x1="520" y1="165" x2="520" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="505" y="190" width="30" height="30"/><text x="520" y="234" text-anchor="middle" font-size="11">gateway2</text><line x1="520" y1="165" x2="615" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="600" y="190" width="30" height="30"/><text x="615" y="234" text-anchor="middle" font-size="11">gateway3</text><use href="#i-svc" xlink:href="#i-svc" x="505" y="265" width="30" height="30"/><text x="520" y="310" text-anchor="middle" font-size="11">tickets</text><use href="#i-cpu" xlink:href="#i-cpu" x="537" y="265" width="22" height="22"/><line x1="425" y1="240" x2="520" y2="263" stroke="#444"/><line x1="520" y1="240" x2="520" y2="263" stroke="#444"/><line x1="615" y1="240" x2="520" y2="263" stroke="#444"/><rect x="370" y="330" width="300" height="80" rx="8" fill="#fde8e8" stroke="#c81e1e"/><text x="520" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#c81e1e">27 req/s</text><text x="520" y="390" text-anchor="middle">P50 5,604 ms at 100 users</text><text x="870" y="100" text-anchor="middle" font-size="15" font-weight="bold">2b. three cells</text><use href="#i-lb" xlink:href="#i-lb" x="855" y="115" width="30" height="30"/><text x="870" y="160" text-anchor="middle" font-size="11">nginx</text><line x1="870" y1="165" x2="775" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="760" y="190" width="30" height="30"/><text x="775" y="234" text-anchor="middle" font-size="11">gateway1</text><line x1="870" y1="165" x2="870" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="855" y="190" width="30" height="30"/><text x="870" y="234" text-anchor="middle" font-size="11">gateway2</text><line x1="870" y1="165" x2="965" y2="190" stroke="#444"/><use href="#i-gate" xlink:href="#i-gate" x="950" y="190" width="30" height="30"/><text x="965" y="234" text-anchor="middle" font-size="11">gateway3</text><use href="#i-svc" xlink:href="#i-svc" x="760" y="265" width="30" height="30"/><text x="775" y="310" text-anchor="middle" font-size="11">tickets</text><use href="#i-svc" xlink:href="#i-svc" x="855" y="265" width="30" height="30"/><text x="870" y="310" text-anchor="middle" font-size="11">tickets-2</text><use href="#i-svc" xlink:href="#i-svc" x="950" y="265" width="30" height="30"/><text x="965" y="310" text-anchor="middle" font-size="11">tickets-3</text><line x1="775" y1="240" x2="775" y2="263" stroke="#444"/><line x1="870" y1="240" x2="870" y2="263" stroke="#444"/><line x1="965" y1="240" x2="965" y2="263" stroke="#444"/><rect x="720" y="330" width="300" height="80" rx="8" fill="#e8f0fe" stroke="#1a56db"/><text x="870" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a56db">56 req/s</text><text x="870" y="390" text-anchor="middle">P50 1,901 ms at 100 users</text><rect x="20" y="430" width="1000" height="110" rx="8" fill="#f4f4f2" stroke="#888"/><text x="34" y="452" font-weight="bold" fill="#0b0b0b">What changed and why</text><text x="34" y="472" fill="#0b0b0b">2a adds gateways only. The gateway was not the slow part, so the line at tickets-service (the CPU icon) stays the same.</text><text x="34" y="490" fill="#0b0b0b">2b gives every gateway its own tickets-service. Now three CPUs classify at the same time, so throughput rises and waiting falls.</text><text x="34" y="508" fill="#0b0b0b">Rule: measure which box is busy (docker stats), then add copies of THAT box. Copies of anything else only add cost.</text></svg>
</defs><rect width="1060" height="700" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">v18 system design lab: the complete picture</text><text x="20" y="56" fill="#52514e">Load balancer -> 3 gateways -> each gateway with its own services (a cell) -> primary database + replicas + shard</text><use href="#i-user" xlink:href="#i-user" x="20" y="72" width="20" height="20"/><text x="46" y="87" font-size="12" fill="#52514e">user</text><use href="#i-lb" xlink:href="#i-lb" x="155" y="72" width="20" height="20"/><text x="181" y="87" font-size="12" fill="#52514e">load balancer</text><use href="#i-gate" xlink:href="#i-gate" x="290" y="72" width="20" height="20"/><text x="316" y="87" font-size="12" fill="#52514e">gateway</text><use href="#i-svc" xlink:href="#i-svc" x="425" y="72" width="20" height="20"/><text x="451" y="87" font-size="12" fill="#52514e">service</text><use href="#i-db" xlink:href="#i-db" x="560" y="72" width="20" height="20"/><text x="586" y="87" font-size="12" fill="#52514e">database</text><use href="#i-copy" xlink:href="#i-copy" x="695" y="72" width="20" height="20"/><text x="721" y="87" font-size="12" fill="#52514e">replica copy</text><use href="#i-cpu" xlink:href="#i-cpu" x="830" y="72" width="20" height="20"/><text x="856" y="87" font-size="12" fill="#52514e">bottleneck (CPU)</text><rect x="20" y="230" width="130" height="90" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-user" xlink:href="#i-user" x="30" y="240" width="30" height="30"/><text x="68" y="260" font-weight="bold" fill="#0b0b0b">Users</text><text x="32" y="286" font-size="12" fill="#52514e">browser / loadtest</text><text x="32" y="303" font-size="12" fill="#52514e">GET /api/tickets/7</text><rect x="190" y="220" width="160" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-lb" xlink:href="#i-lb" x="200" y="230" width="30" height="30"/><text x="238" y="250" font-weight="bold" fill="#0b0b0b">nginx</text><text x="202" y="276" font-size="12" fill="#52514e">nginx/step2.conf</text><text x="202" y="293" font-size="12" fill="#52514e">port 8090 -> 80</text><text x="202" y="310" font-size="12" fill="#52514e">round robin</text><rect x="400" y="110" width="150" height="110" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="410" y="120" width="30" height="30"/><text x="448" y="140" font-weight="bold" fill="#0b0b0b">gateway1</text><text x="412" y="166" font-size="12" fill="#52514e">gateway/main.py</text><text x="412" y="183" font-size="12" fill="#52514e">/api/users -> users</text><text x="412" y="200" font-size="12" fill="#52514e">/api/tickets -> tickets</text><rect x="600" y="105" width="190" height="55" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="115" width="30" height="30"/><text x="648" y="135" font-weight="bold" fill="#0b0b0b">users-service</text><rect x="600" y="170" width="190" height="55" rx="8" fill="#fde8e8" stroke="#c81e1e" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="180" width="30" height="30"/><text x="648" y="200" font-weight="bold" fill="#0b0b0b">tickets-service</text><line x1="350" y1="275" x2="398" y2="165" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="155" x2="598" y2="132" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="180" x2="598" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="390" y="98" width="410" height="134" rx="10" fill="none" stroke="#6250d6" stroke-dasharray="5 4"/><text x="796" y="109" text-anchor="end" font-size="11" fill="#6250d6">cell 1</text><rect x="400" y="260" width="150" height="110" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="410" y="270" width="30" height="30"/><text x="448" y="290" font-weight="bold" fill="#0b0b0b">gateway2</text><text x="412" y="316" font-size="12" fill="#52514e">gateway/main.py</text><text x="412" y="333" font-size="12" fill="#52514e">/api/users -> users</text><text x="412" y="350" font-size="12" fill="#52514e">/api/tickets -> tickets</text><rect x="600" y="255" width="190" height="55" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="265" width="30" height="30"/><text x="648" y="285" font-weight="bold" fill="#0b0b0b">users-service-2</text><rect x="600" y="320" width="190" height="55" rx="8" fill="#fde8e8" stroke="#c81e1e" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="330" width="30" height="30"/><text x="648" y="350" font-weight="bold" fill="#0b0b0b">tickets-service-2</text><line x1="350" y1="275" x2="398" y2="315" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="305" x2="598" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="330" x2="598" y2="348" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="390" y="248" width="410" height="134" rx="10" fill="none" stroke="#6250d6" stroke-dasharray="5 4"/><text x="796" y="259" text-anchor="end" font-size="11" fill="#6250d6">cell 2</text><rect x="400" y="410" width="150" height="110" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-gate" xlink:href="#i-gate" x="410" y="420" width="30" height="30"/><text x="448" y="440" font-weight="bold" fill="#0b0b0b">gateway3</text><text x="412" y="466" font-size="12" fill="#52514e">gateway/main.py</text><text x="412" y="483" font-size="12" fill="#52514e">/api/users -> users</text><text x="412" y="500" font-size="12" fill="#52514e">/api/tickets -> tickets</text><rect x="600" y="405" width="190" height="55" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="415" width="30" height="30"/><text x="648" y="435" font-weight="bold" fill="#0b0b0b">users-service-3</text><rect x="600" y="470" width="190" height="55" rx="8" fill="#fde8e8" stroke="#c81e1e" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="610" y="480" width="30" height="30"/><text x="648" y="500" font-weight="bold" fill="#0b0b0b">tickets-service-3</text><line x1="350" y1="275" x2="398" y2="465" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="455" x2="598" y2="432" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550" y1="480" x2="598" y2="498" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="390" y="398" width="410" height="134" rx="10" fill="none" stroke="#6250d6" stroke-dasharray="5 4"/><text x="796" y="409" text-anchor="end" font-size="11" fill="#6250d6">cell 3</text><line x1="150" y1="275" x2="188" y2="275" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="850" y="130" width="190" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="860" y="140" width="30" height="30"/><text x="898" y="160" font-weight="bold" fill="#0b0b0b">db (primary)</text><text x="862" y="186" font-size="12" fill="#52514e">all writes</text><text x="862" y="203" font-size="12" fill="#52514e">streams changes</text><text x="862" y="220" font-size="12" fill="#52514e">to the replicas</text><rect x="850" y="290" width="190" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-copy" xlink:href="#i-copy" x="860" y="300" width="30" height="30"/><text x="898" y="320" font-weight="bold" fill="#0b0b0b">db-replica-1, -2</text><text x="862" y="346" font-size="12" fill="#52514e">heavy reads (stats)</text><rect x="850" y="400" width="190" height="70" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="860" y="410" width="30" height="30"/><text x="898" y="430" font-weight="bold" fill="#0b0b0b">db-shard-1</text><text x="862" y="456" font-size="12" fill="#52514e">half the tickets (odd users)</text><line x1="790" y1="200" x2="848" y2="185" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="790" y1="340" x2="848" y2="325" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><line x1="945" y1="240" x2="945" y2="288" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="945.0" y="264.0" text-anchor="middle" font-size="11" fill="#52514e">WAL stream</text><line x1="790" y1="420" x2="848" y2="435" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><rect x="20" y="590" width="1020" height="92" rx="8" fill="#f4f4f2" stroke="#888"/><text x="34" y="612" font-weight="bold" fill="#0b0b0b">How a request travels</text><text x="34" y="632" fill="#0b0b0b">1. nginx picks a gateway in turn (gateway1, 2, 3, 1, ...). 2. The gateway reads /api/&lt;service&gt;/ and calls that service by NAME (Docker DNS).</text><text x="34" y="650" fill="#0b0b0b">3. The service writes to the primary (or the shard that owns the user), and sends heavy reads to a replica. 4. The answer goes back the same way.</text><text x="34" y="668" fill="#0b0b0b">Only nginx publishes a port. Everything else is on Docker's private network, reachable only by container name.</text></svg>
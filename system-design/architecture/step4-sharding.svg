<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1060" height="590" viewBox="0 0 1060 590" font-family="Arial, Helvetica, sans-serif" font-size="13">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker>
 <symbol id="i-user" viewBox="0 0 32 32"><circle cx="16" cy="10" r="6" fill="#444"/><path d="M4,30 C4,19 28,19 28,30 z" fill="#444"/></symbol>
 <symbol id="i-lb" viewBox="0 0 32 32"><circle cx="6" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="5" r="4" fill="#1a56db"/><circle cx="26" cy="16" r="4" fill="#1a56db"/><circle cx="26" cy="27" r="4" fill="#1a56db"/><path d="M10,16 L22,5 M10,16 L22,16 M10,16 L22,27" stroke="#1a56db" stroke-width="2.5"/></symbol>
 <symbol id="i-gate" viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="27" rx="2" fill="none" stroke="#6250d6" stroke-width="3"/><rect x="11" y="12" width="10" height="18" fill="#6250d6"/><circle cx="16" cy="8" r="2" fill="#6250d6"/></symbol>
 <symbol id="i-svc" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#1baf7a" stroke-width="5" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="4" fill="#1baf7a"/></symbol>
 <symbol id="i-db" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100"/><path d="M4,6 V26 C4,31 28,31 28,26 V6" fill="#f6c453" stroke="#c98500" stroke-width="1.5"/><ellipse cx="16" cy="6" rx="12" ry="4" fill="#eda100" stroke="#c98500" stroke-width="1.5"/><path d="M4,16 C4,20 28,20 28,16" fill="none" stroke="#c98500" stroke-width="1.5"/></symbol>
 <symbol id="i-copy" viewBox="0 0 32 32"><path d="M6,16 A10,10 0 1 1 16,26" fill="none" stroke="#1baf7a" stroke-width="3"/><path d="M11,26 L16,26 L16,21" fill="none" stroke="#1baf7a" stroke-width="3"/></symbol>
 <symbol id="i-cpu" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" rx="2" fill="#c81e1e"/><path d="M12,3 V8 M20,3 V8 M12,24 V29 M20,24 V29 M3,12 H8 M3,20 H8 M24,12 H29 M24,20 H29" stroke="#c81e1e" stroke-width="2"/></symbol>
 <symbol id="i-file" viewBox="0 0 32 32"><path d="M7,3 H20 L26,9 V29 H7 z" fill="#fff" stroke="#444" stroke-width="2"/><path d="M11,14 H22 M11,19 H22 M11,24 H18" stroke="#444" stroke-width="2"/></symbol>
 <symbol id="i-net" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#444" stroke-width="2"/><path d="M4,16 H28 M16,4 C9,10 9,22 16,28 M16,4 C23,10 23,22 16,28" fill="none" stroke="#444" stroke-width="2"/></symbol>
</defs><rect width="1060" height="590" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="bold" fill="#0b0b0b">Step 4: database sharding by user_id</text><text x="20" y="56" fill="#52514e">Two databases, each with half of the tickets</text><rect x="20" y="110" width="220" height="110" rx="8" fill="#f4f4f2" stroke="#888" stroke-width="1.5"/><use href="#i-svc" xlink:href="#i-svc" x="30" y="120" width="30" height="30"/><text x="68" y="140" font-weight="bold" fill="#0b0b0b">tickets-service</text><text x="32" y="166" font-size="12" fill="#52514e">shard = user_id % 2</text><text x="32" y="183" font-size="12" fill="#52514e">the shard key</text><rect x="330" y="80" width="230" height="100" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="340" y="90" width="30" height="30"/><text x="378" y="110" font-weight="bold" fill="#0b0b0b">db (shard 0)</text><text x="342" y="136" font-size="12" fill="#52514e">even user_id</text><text x="342" y="153" font-size="12" fill="#52514e">half the tickets</text><rect x="330" y="210" width="230" height="100" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><use href="#i-db" xlink:href="#i-db" x="340" y="220" width="30" height="30"/><text x="378" y="240" font-weight="bold" fill="#0b0b0b">db-shard-1 (shard 1)</text><text x="342" y="266" font-size="12" fill="#52514e">odd user_id</text><text x="342" y="283" font-size="12" fill="#52514e">the other half</text><line x1="240" y1="145" x2="328" y2="130" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="284.0" y="131.5" text-anchor="middle" font-size="11" fill="#52514e">user 4 -> 0</text><line x1="240" y1="185" x2="328" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/><text x="284.0" y="216.5" text-anchor="middle" font-size="11" fill="#52514e">user 7 -> 1</text><rect x="610" y="80" width="210" height="230" rx="8" fill="#fde8e8" stroke="#c81e1e"/><text x="715" y="110" text-anchor="middle" font-weight="bold" fill="#c81e1e">Writes, 50 users</text><text x="715" y="160" text-anchor="middle" font-size="20" font-weight="bold">58 -> 61</text><text x="715" y="183" text-anchor="middle">req/s (1 db -> 2 shards)</text><rect x="830" y="80" width="210" height="230" rx="8" fill="#e8f0fe" stroke="#1a56db"/><text x="935" y="110" text-anchor="middle" font-weight="bold" fill="#1a56db">Stats (asks every shard)</text><text x="935" y="160" text-anchor="middle" font-size="20" font-weight="bold">13 -> 18</text><text x="935" y="183" text-anchor="middle">req/s (1 db -> 2 shards)</text><rect x="20" y="340" width="1020" height="222" rx="8" fill="#f4f4f2" stroke="#888"/><text x="34" y="362" font-weight="bold" fill="#0b0b0b">Sharding: why and when</text><text x="34" y="382" fill="#0b0b0b">WHY: the data or the WRITES no longer fit one database (disk, memory, or write CPU). Replicas cannot help: each copy gets every write.</text><text x="34" y="400" fill="#0b0b0b">Sharding splits the rows: each database owns part of the data and takes only its part of the writes.</text><text x="34" y="418" fill="#0b0b0b">COST: every query needs the shard key (user_id). Without it you ask every shard (GET /tickets/7 without user_id -> 400).</text><text x="34" y="436" fill="#0b0b0b">Totals across shards (stats) are added up in code, joins across shards are hard, and moving data to a new shard is a big job.</text><text x="34" y="454" fill="#0b0b0b">WHEN: last. First indexes, a bigger machine, replicas, caching. Shard only when one primary truly cannot keep up.</text><text x="34" y="472" fill="#0b0b0b">MEASURED HERE: writes did not rise. Each database used only ~25-30% CPU: the limit was the shared disk and the Python services,</text><text x="34" y="490" fill="#0b0b0b">not the database CPU. Sharding a database that is not the bottleneck adds work and no speed. Stats rose because each shard scans half.</text></svg>
# System design lab, step 1: ONE gateway.
#
#   user -> nginx (port 8090) -> gateway1 -> users-service / tickets-service -> db
#
# Start:      docker compose up -d --build
# Load test:  docker compose run --rm loadtest python loadtest/loadtest.py --path /api/tickets
# Stop:       docker compose down -v
#
# Later steps ADD files on top of this one (see README.md), for example:
#   docker compose -f docker-compose.yml -f step2-gateways.yml up -d
#
# Every container joins one Docker network and reaches the others by
# their service name (http://gateway1:8000, db:5432). Only nginx has a
# `ports:` line, because it is the only thing your browser must reach.

x-python: &python
  # All Python containers share one image. Only users-service has `build`,
  # so it is built once; the others reuse it.
  image: sd-python
  pull_policy: never
  restart: unless-stopped
  # Each app container gets 1 CPU, like one small server.
  # This keeps the experiment fair on a laptop with many cores.
  cpus: 1.0

services:
  # The primary database: every write goes here.
  db:
    image: postgres:17-alpine
    cpus: 1.0
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db/schema.sql:/sql/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      retries: 20

  users-service:
    <<: *python
    build: .
    hostname: users-service   # shown as served_by
    command: ["uvicorn", "services.users.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
    depends_on:
      db: { condition: service_healthy }

  tickets-service:
    <<: *python
    hostname: tickets-service
    command: ["uvicorn", "services.tickets.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DATABASE_URLS: postgresql://lab:lab@db:5432/lab
    depends_on:
      db: { condition: service_healthy }

  gateway1:
    <<: *python
    hostname: gateway1        # shown as X-Gateway
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      USERS_SERVICE_URL: http://users-service:8001
      TICKETS_SERVICE_URL: http://tickets-service:8002
    depends_on: [users-service, tickets-service]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"          # your machine's port 8090 -> nginx's port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # our config, mounted read-only
    depends_on: [gateway1]
    restart: unless-stopped

  # Not started by `up`; run it with `docker compose run --rm loadtest ...`.
  # It runs inside the network, so it calls http://nginx like a user would.
  loadtest:
    <<: *python
    restart: "no"
    cpus: 4.0
    profiles: ["tools"]
    command: ["python", "loadtest/loadtest.py"]
    volumes:
      - ./results:/app/results   # results/*.json land on your disk

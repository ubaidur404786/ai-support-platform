# The API (3 copies) and the worker (1 copy). Same image, different command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Three copies: if one crashes or is being replaced, the other two keep
  # answering. Change it any time with: kubectl scale deployment api --replicas=5
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: support-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: app-settings }
            - secretRef: { name: app-secrets }
          # Ready = the API answers /health. It still answers when a model
          # service is down (v14), so a restarting model service does not take
          # every API copy out of service with it.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { memory: 200Mi, cpu: 100m }
            limits: { memory: 600Mi }
---
# Internal: the web app's nginx reaches the API as http://api:8000. Kubernetes
# spreads requests over the 3 copies.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: support-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: app-settings }
            - secretRef: { name: app-secrets }
          resources:
            requests: { memory: 150Mi, cpu: 100m }
            limits: { memory: 600Mi }

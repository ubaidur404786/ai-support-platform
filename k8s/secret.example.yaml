# An example only - never commit the real one.
#
# Create the real Secret from the command line instead:
#
#   kubectl create secret generic app-secrets \
#     --from-literal=POSTGRES_PASSWORD=choose-a-password \
#     --from-literal=DATABASE_URL=postgresql+psycopg://support:choose-a-password@db:5432/support_platform \
#     --from-literal=JWT_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
#
# Kubernetes only base64-encodes Secret values; it does not encrypt them by
# default. What a Secret gives us is separation: different permissions, and
# settings that never appear in a file in Git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://support:change-me@db:5432/support_platform
  JWT_SECRET_KEY: change-me-to-a-random-value-of-at-least-32-characters

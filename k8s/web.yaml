# The web app (v17): the only part of the system reachable from outside.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: support-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { memory: 16Mi, cpu: 20m }
            limits: { memory: 64Mi }
---
# NodePort: open port 30080 on every machine in the cluster. This is the
# simplest way in on a laptop (k3s in Docker) and on a single server (k3s on AWS).
# A larger setup would use a load balancer or an Ingress instead.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 8080
      nodePort: 30080
